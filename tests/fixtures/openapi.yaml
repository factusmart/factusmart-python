  /catalogos:
    get:
      operationId: listCatalogs
      tags: [Herramientas]
      summary: Listar catálogos SUNAT disponibles
      description: |
        Lista los catálogos SUNAT que puedes consultar con `GET /catalogos/{nombre}`. No consume crédito.

        | Nombre | Catálogo SUNAT | Contenido | Campos extra |
        |---|---|---|---|
        | `tipos-documento` | 01 | Tipos de comprobante | `abreviatura` |
        | `monedas` | 02 | Monedas | `simbolo` |
        | `unidades` | 03 | Unidades de medida | `simbolo` |
        | `documentos-identidad` | 06 | Tipos de documento de identidad | — |
        | `afectacion-igv` | 07 | Afectación del IGV | `es_exportacion`, `es_gratuito` |
        | `motivos-nota-credito` | 09 | Motivos de nota de crédito | — |
        | `motivos-nota-debito` | 10 | Motivos de nota de débito | — |
        | `modalidad-transporte` | 18 | Modalidad de transporte (guías) | — |
        | `motivos-traslado` | 20 | Motivos de traslado (guías) | — |
        | `tipos-operacion` | 51 | Tipos de operación | `es_exportacion` |
        | `detracciones` | 54 | Bienes y servicios sujetos a detracción | `porcentaje` |

        | `productos-sunat` | 25 | Código de producto SUNAT (UNSPSC v14, ~53 mil códigos) | — |

        El catálogo 25 no se lista entero: búscalo con `GET /catalogos/productos-sunat?q=` (ver
        [Buscar el código de producto SUNAT](#operation/searchSunatProductCodes)).

        Acepta `?ruc=` / `X-RUC` como el resto de endpoints, pero la lista es la misma para todos los
        RUC: el RUC solo cambia las filas de `GET /catalogos/{nombre}`. Si lo mandas, debe ser de tu
        cuenta (si no, `403 RUC_NO_AUTORIZADO`).
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Lista de catálogos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListResponse'
              example:
                success: true
                catalogos:
                  - { nombre: tipos-documento, catalogo_sunat: "01", descripcion: Tipos de comprobante, url: /api/v1/issuer/catalogos/tipos-documento }
                  - { nombre: monedas, catalogo_sunat: "02", descripcion: Monedas, url: /api/v1/issuer/catalogos/monedas }
                  - { nombre: unidades, catalogo_sunat: "03", descripcion: Unidades de medida, url: /api/v1/issuer/catalogos/unidades }
                  - { nombre: productos-sunat, catalogo_sunat: "25", descripcion: 'Código de producto SUNAT (UNSPSC v14) — buscador: ?q=texto o código, ?limite= (máx. 50)', url: /api/v1/issuer/catalogos/productos-sunat }
                nota: 'Código de producto SUNAT (UNSPSC, catálogo 25): búscalo con GET /api/v1/issuer/catalogos/productos-sunat?q=texto|codigo y envíalo en "codigo_producto_sunat" del ítem.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: El plan de la cuenta venció (`PLAN_VENCIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'El plan de tu cuenta venció. Renuévalo para volver a emitir.', codigo: PLAN_VENCIDO, reintentable: false }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /catalogos/productos-sunat:
    get:
      operationId: searchSunatProductCodes
      tags: [Herramientas]
      summary: Buscar el código de producto SUNAT
      description: |
        Buscador del **código de producto SUNAT** (catálogo 25 = UNSPSC v14, 8 dígitos): el valor que
        va en `codigo_producto_sunat` de cada ítem. No consume crédito y **no necesita RUC** (el
        catálogo es el mismo para todos; si mandas `?ruc=` se ignora).

        - `?q=` con **dígitos** busca por código: exacto o prefijo de 2 a 8 dígitos (`4321` lista esa
          familia). Primero va el código exacto, luego el resto en orden.
        - `?q=` con **texto** (mínimo 3 letras) busca todas las palabras en la descripción y la
          categoría, sin importar tildes ni mayúsculas. Primero los productos (nivel 4, el que va en
          el comprobante) cuya propia descripción contiene la frase, los más cortos primero.
        - `total` = cuántos resultados vienen en esta respuesta (no el total de coincidencias). `hay_mas: true` = hay más resultados que `limite`: afina la búsqueda o sube `limite`.

        **Es opcional en factura y boleta**: SUNAT no lo exige para emitirlas. Envíalo solo si tu
        caso lo requiere; si lo envías, usa un código de nivel `producto`.

        Fuente: el Excel oficial de SUNAT (`CCNU_MOD_2.xlsm`, hoja "Bienes y Servicios") publicado en
        <https://cpe.sunat.gob.pe/informacion_general/codigoproducto>. Resultados en caché 6 horas.
      parameters:
        - name: q
          in: query
          required: true
          description: Código (2 a 8 dígitos, exacto o prefijo) o texto (3 a 100 caracteres).
          schema: { type: string, minLength: 2, maxLength: 100 }
          example: computador
        - name: limite
          in: query
          required: false
          description: Máximo de resultados (1 a 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          example: 3
        - name: nivel
          in: query
          required: false
          description: Filtra por nivel de la jerarquía UNSPSC. Para el comprobante usa `producto`.
          schema:
            type: string
            enum: [segmento, familia, clase, producto]
      responses:
        '200':
          description: Códigos encontrados (`datos` puede venir vacío si no hay coincidencias).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunatProductSearchResponse'
              examples:
                texto:
                  summary: GET /catalogos/productos-sunat?q=computador&limite=3
                  value:
                    success: true
                    catalogo: productos-sunat
                    catalogo_sunat: "25"
                    descripcion: 'Código de producto SUNAT (UNSPSC v14). Va en "codigo_producto_sunat" de cada ítem.'
                    q: computador
                    total: 3
                    hay_mas: true
                    datos:
                      - { codigo: "43211516", descripcion: Minicomputadores, nivel: producto, categoria: 'Difusión de Tecnologías de Información y Telecomunicaciones > Equipo informático y accesorios > Computadores' }
                      - { codigo: "43202222", descripcion: Cables de computador, nivel: producto, categoria: 'Difusión de Tecnologías de Información y Telecomunicaciones > Componentes para tecnología de la información, difusión o telecomunicaciones > Subconjuntos para dispositivos electrónicos' }
                      - { codigo: "43211503", descripcion: Computadores notebook, nivel: producto, categoria: 'Difusión de Tecnologías de Información y Telecomunicaciones > Equipo informático y accesorios > Computadores' }
                codigo:
                  summary: GET /catalogos/productos-sunat?q=432115&limite=2
                  value:
                    success: true
                    catalogo: productos-sunat
                    catalogo_sunat: "25"
                    descripcion: 'Código de producto SUNAT (UNSPSC v14). Va en "codigo_producto_sunat" de cada ítem.'
                    q: "432115"
                    total: 2
                    hay_mas: true
                    datos:
                      - { codigo: "43211500", descripcion: Computadores, nivel: clase, categoria: 'Difusión de Tecnologías de Información y Telecomunicaciones > Equipo informático y accesorios' }
                      - { codigo: "43211501", descripcion: Servidores de computador, nivel: producto, categoria: 'Difusión de Tecnologías de Información y Telecomunicaciones > Equipo informático y accesorios > Computadores' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Parámetros inválidos (`DATOS_INVALIDOS`, detalle en `campos`): falta `q`, código de menos
            de 2 o más de 8 dígitos, texto de menos de 3 letras o más de 100 caracteres, `limite`
            fuera de 1..50, o `nivel` desconocido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolValidationError'
              example:
                campos: { q: ['Escribe al menos 3 letras para buscar por texto.'] }
                success: false
                message: 'Datos inválidos: Escribe al menos 3 letras para buscar por texto.'
                codigo: DATOS_INVALIDOS
                reintentable: false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'
        '503':
          description: |
            El catálogo todavía no está cargado en este servidor (`CATALOGO_NO_DISPONIBLE`).
            Reintentar no lo arregla: mientras tanto envía el código de 8 dígitos en
            `codigo_producto_sunat` (es opcional para SUNAT) o emite sin él.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: 'El catálogo de códigos de producto SUNAT todavía no está cargado en este servidor. Mientras tanto, envía el código de 8 dígitos en "codigo_producto_sunat" (es opcional para SUNAT).'
                codigo: CATALOGO_NO_DISPONIBLE
                reintentable: false

  /catalogos/{nombre}:
    get:
      operationId: getCatalog
      tags: [Herramientas]
      summary: Filas de un catálogo SUNAT
      description: |
        Devuelve las filas de un catálogo. No consume crédito. Se guarda en caché 12 horas.

        - `{nombre}`: el nombre (`unidades`) o el número SUNAT (`03`); `/catalogos/07` = `/catalogos/afectacion-igv`.
        - `?q=` filtra por código o descripción (máx. 100 caracteres).
        - Con `X-RUC` / `?ruc=` lee el catálogo de ese RUC (cada empresa puede tener filas
          desactivadas). Sin RUC se usa el primer RUC de la cuenta.
        - Cada fila trae `codigo`, `descripcion`, `activo` y los campos extra del catálogo. **Usa solo
          las filas con `activo: true`**: el RUC valida contra ellas al emitir.
      parameters:
        - name: nombre
          in: path
          required: true
          description: Nombre del catálogo o su número SUNAT (ver `GET /catalogos`).
          schema:
            type: string
            examples: [unidades]
          example: unidades
        - name: q
          in: query
          required: false
          description: Filtro por código o descripción (no distingue mayúsculas). Máx. 100 caracteres.
          schema: { type: string, maxLength: 100 }
          example: kilo
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Filas del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
              examples:
                unidades:
                  summary: GET /catalogos/unidades?q=kilo
                  value:
                    success: true
                    catalogo: unidades
                    catalogo_sunat: "03"
                    descripcion: Unidades de medida
                    total: 2
                    datos:
                      - { codigo: KGM, descripcion: Kilos, activo: true, simbolo: KG }
                      - { codigo: KWH, descripcion: Kilovatio hora, activo: false, simbolo: KWxH }
                afectacionIgv:
                  summary: GET /catalogos/07 (recortado)
                  value:
                    success: true
                    catalogo: afectacion-igv
                    catalogo_sunat: "07"
                    descripcion: Tipos de afectación del IGV
                    total: 19
                    datos:
                      - { codigo: "10", descripcion: Gravado - Operación Onerosa, activo: true, es_exportacion: false, es_gratuito: false }
                      - { codigo: "11", descripcion: Gravado – Retiro por premio, activo: true, es_exportacion: false, es_gratuito: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: El plan de la cuenta venció (`PLAN_VENCIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'El plan de tu cuenta venció. Renuévalo para volver a emitir.', codigo: PLAN_VENCIDO, reintentable: false }
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: El catálogo no existe. Trae la lista en `catalogos_disponibles`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      catalogos_disponibles:
                        type: array
                        items: { type: string }
              example:
                catalogos_disponibles: [tipos-documento, monedas, unidades, documentos-identidad, afectacion-igv, motivos-nota-credito, motivos-nota-debito, modalidad-transporte, motivos-traslado, tipos-operacion, detracciones]
                success: false
                message: 'Catálogo "noexiste" no existe. Lista disponible en GET /catalogos.'
                codigo: NO_ENCONTRADO
                reintentable: false
        '422':
          description: |
            `q` demasiado largo (`DATOS_INVALIDOS`), o la cuenta todavía no tiene ningún RUC
            (`RUC_REQUERIDO`; crea uno con `POST /rucs`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: 'Tu cuenta todavía no tiene ningún RUC enlazado: los catálogos se leen del sistema de facturación de tu RUC. Crea uno con POST /rucs.'
                codigo: RUC_REQUERIDO
                reintentable: false
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

webhooks:
  comprobanteEstado:
    post:
      operationId: webhookComprobanteEstado
      tags: [Webhooks]
      summary: Aviso de cambio de estado de un comprobante
      description: |
        **FactuSmart llama a TU servidor** (no es un endpoint que tú llames). Se envía cuando un
        comprobante **emitido por el API** pasa a `05` Aceptado (`comprobante.aceptado`), `07` Observado
        (`comprobante.observado`), `09` Rechazado (`comprobante.rechazado`) u `11` Anulado
        (`comprobante.anulado`). El botón **Enviar prueba** del portal manda el evento `prueba`
        (un solo intento, sin reintentos). Los comprobantes emitidos desde el panel web no generan aviso.

        **Configuración:** solo desde el portal del integrador, pestaña **Webhooks**: una URL por cuenta
        (recibes los avisos de todos tus RUCs), debe ser `https://` y pública (no se aceptan `localhost`,
        IPs privadas ni de metadatos de nube). Al guardarla se genera un secreto `whsec_…`, que puedes
        regenerar cuando quieras. Para desactivarlo, deja la URL vacía y guarda.

        **Verificar la firma:** `X-FactuSmart-Firma` es el HMAC-SHA256 en hexadecimal del **cuerpo crudo**
        (tal cual llega, sin volver a serializarlo) usando tu secreto. Compáralo en tiempo constante; si no
        coincide, responde `401` e ignora el aviso. Con los SDK:

        - Node: `FactuSmart.verificarFirmaWebhook(cuerpoCrudo, firma, secreto)` → `boolean`
        - PHP: `\FactuSmart\Cliente::verificarFirmaWebhook($cuerpoCrudo, $firma, $secreto)` → `bool`
        - Python: `factusmart.verificar_firma_webhook(cuerpo_crudo, firma, secreto)` → `bool`

        **Reintentos:** si tu servidor no responde `2xx` en **8 segundos** (error, timeout, conexión
        rechazada o una redirección `301`/`302`, que no se sigue), se reintenta con espera creciente:
        **6 intentos en total** — inmediato, +1 min, +5 min, +30 min, +2 h y +6 h. Si fallan todos, el
        aviso queda como **Error** en el portal (**Webhooks → Últimas entregas**, 50 más recientes, 30
        días de historial) y puedes seguir consultando `GET /documents/{external_id}`. El `id` es el
        mismo en todos los reintentos: guárdalo para no procesar dos veces el mismo aviso. Si el proceso
        es largo, responde `200` de inmediato y procésalo después. El envío no retrasa la emisión.
      security: []
      parameters:
        - name: X-FactuSmart-Evento
          in: header
          required: true
          description: Tipo de evento (igual que `evento` del cuerpo).
          schema: { $ref: '#/components/schemas/WebhookEvento' }
        - name: X-FactuSmart-Id
          in: header
          required: true
          description: Identificador único del aviso (igual que `id` del cuerpo). No cambia entre reintentos.
          schema: { type: string, format: uuid }
        - name: X-FactuSmart-Intento
          in: header
          required: true
          description: Número de intento, de `1` a `6`.
          schema: { type: string, examples: ['1'] }
        - name: X-FactuSmart-Firma
          in: header
          required: true
          description: HMAC-SHA256 en hexadecimal del cuerpo crudo, con tu secreto `whsec_…`.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: User-Agent
          in: header
          required: true
          schema: { type: string, const: FactuSmart-Webhooks/1.0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookComprobante'
            example:
              id: 0fbb616d-ec40-4bbd-a89f-591d9d404630
              evento: comprobante.aceptado
              ruc: "20777666555"
              external_id: ad4d29e9-7510-4efd-963e-3f8b6fa2facd
              serie_numero: BA01-35
              tipo_documento: "03"
              estado: "05"
              estado_descripcion: Aceptado
              aceptado_por_sunat: true
              entorno: prueba
              sunat: { codigo: "0", descripcion: "La Boleta numero BA01-35, ha sido aceptada" }
              fecha: "2026-10-14T15:29:43-05:00"
      responses:
        '200':
          description: |
            Aviso recibido. Cualquier `2xx` cuenta como entregado; el cuerpo de tu respuesta se ignora.
            Cualquier otro código (o no responder en 8 s) programa un reintento.

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key de la cuenta (panel de integrador, pestaña Configuración). Hay dos: la de producción
        (64 letras y números) y una de prueba opcional que empieza con `fs_test_` y solo escribe en RUCs
        en modo demo. Ver "Llave de prueba y llave de producción".
    BearerApiKey:
      type: http
      scheme: bearer
      description: Alternativa aceptada por el middleware, `Authorization Bearer` con la misma API key. Solo se usa si no hay `X-API-Key`.

  parameters:
    RucQuery:
      name: ruc
      in: query
      required: false
      description: RUC emisor (11 dígitos). Obligatorio si la cuenta tiene varios RUCs. También se acepta `emisor_ruc`.
      schema: { type: string, pattern: '^\d{11}$' }
    XRucHeader:
      name: X-RUC
      in: header
      required: false
      description: Alternativa al campo `ruc` (se usa solo si `ruc` y `emisor_ruc` no vienen).
      schema: { type: string, pattern: '^\d{11}$' }
    ExternalId:
      name: external_id
      in: path
      required: true
      description: Identificador (UUID) devuelto al emitir.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Valor único por venta (ej. el id de la venta en tu sistema). Ver sección Idempotencia.
      schema: { type: string }

  responses:
    Unauthorized:
      description: API key ausente, inválida o cuenta desactivada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinKey:
              value: { success: false, message: 'API key requerida. Envíala en el header X-API-Key.', codigo: NO_AUTENTICADO, reintentable: false }
            invalida:
              value: { success: false, message: 'API key inválida o cuenta desactivada.', codigo: NO_AUTENTICADO, reintentable: false }
    RucForbidden:
      description: El RUC indicado no pertenece a la cuenta, o el RUC está desactivado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ajeno:
              value: { success: false, message: 'El RUC indicado no pertenece a esta cuenta o no existe.', codigo: RUC_NO_AUTORIZADO, reintentable: false }
            desactivado:
              value: { success: false, message: "Este RUC está desactivado. Reactívalo con PATCH /rucs/{ruc}/activation antes de continuar.", codigo: RUC_DESACTIVADO, reintentable: false }
    RucForbiddenOrTestKey:
      description: |
        El RUC no pertenece a la cuenta, está desactivado, o usaste la llave de prueba (`fs_test_…`) en
        un RUC que está en producción (`LLAVE_DE_PRUEBA_EN_PRODUCCION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ajeno:
              value: { success: false, message: 'El RUC indicado no pertenece a esta cuenta o no existe.', codigo: RUC_NO_AUTORIZADO, reintentable: false }
            desactivado:
              value: { success: false, message: "Este RUC está desactivado. Reactívalo con PATCH /rucs/{ruc}/activation antes de continuar.", codigo: RUC_DESACTIVADO, reintentable: false }
            llavePrueba:
              value: { success: false, message: 'Estás usando tu llave de PRUEBA y este RUC está en producción. La llave de prueba solo emite, anula y reenvía en RUCs en modo demo. Usa tu llave de producción.', codigo: LLAVE_DE_PRUEBA_EN_PRODUCCION, reintentable: false }
    TestKeyInProduction:
      description: Usaste la llave de prueba (`fs_test_…`) en un RUC que está en producción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'Estás usando tu llave de PRUEBA y este RUC está en producción. La llave de prueba solo emite, anula y reenvía en RUCs en modo demo. Usa tu llave de producción.', codigo: LLAVE_DE_PRUEBA_EN_PRODUCCION, reintentable: false }
    RucWithoutTenant:
      description: El RUC resuelto no tiene tenant asociado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'El RUC no tiene un tenant asociado.', codigo: RUC_SIN_TENANT, reintentable: false }
    RucRequired:
      description: No se pudo determinar el RUC emisor (cuenta con varios RUCs y no se indicó), o el RUC no tiene tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'Indica el RUC emisor en el campo "ruc".', codigo: RUC_REQUERIDO, reintentable: false }
    DocumentNotFound:
      description: No existe un comprobante con ese `external_id` en el RUC.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'Comprobante no encontrado.', codigo: NO_ENCONTRADO, reintentable: false }
    NoCredits:
      description: Sin créditos disponibles. No se emitió ni envió nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoCreditsError'
          example:
            success: false
            message: Sin créditos disponibles en la cuenta. Recargue para seguir emitiendo.
            codigo: SIN_CREDITOS
            reintentable: false
            creditos_restantes: 0
    LaravelValidation:
      description: |
        Validación por campo fallida (`codigo: DATOS_INVALIDOS`). El detalle está en `campos`. Por
        compatibilidad, el mismo mapa también va en la raíz (con `Accept: application/json`) o dentro de
        `message` (sin ese header).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            activo: [El campo activo es obligatorio.]
            success: false
            message: 'Datos inválidos: El campo activo es obligatorio.'
            campos: { activo: [El campo activo es obligatorio.] }
            codigo: DATOS_INVALIDOS
            reintentable: false
    RateLimited:
      description: |
        Límite de peticiones superado (120/min por API key, 60/min por IP). Espera los segundos
        indicados en `Retry-After` (o `retry_after`) y reintenta.
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar.
          schema: { type: integer }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  retry_after: { type: integer }
          example:
            success: false
            message: Demasiadas peticiones. Espera 40 segundos e intenta de nuevo.
            retry_after: 40
            codigo: LIMITE_PETICIONES
            reintentable: true
    RateLimitedOrDemoLimit:
      description: |
        Dos casos con el mismo HTTP 429, distínguelos por `codigo`:

        - `LIMITE_PETICIONES` (reintentable): superaste 120/min por API key o 60/min por IP. Espera
          `Retry-After` segundos.
        - `LIMITE_PRUEBAS_DIARIO` (**no** reintentable): llegaste a las 200 operaciones en modo demo de
          hoy. El cupo se reinicia a medianoche (hora de Perú). En producción no existe este tope.
      headers:
        Retry-After:
          description: Solo en `LIMITE_PETICIONES`. Segundos a esperar antes de reintentar.
          schema: { type: integer }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  retry_after: { type: integer, description: Solo en LIMITE_PETICIONES. }
                  pruebas_restantes_hoy: { type: integer, description: Solo en LIMITE_PRUEBAS_DIARIO (siempre 0). }
                  limite_pruebas_diario: { type: integer, description: Solo en LIMITE_PRUEBAS_DIARIO. }
                  creditos_restantes: { type: integer, description: Solo en LIMITE_PRUEBAS_DIARIO. }
          examples:
            limitePeticiones:
              summary: Límite de peticiones por minuto (reintentable)
              value:
                success: false
                message: Demasiadas peticiones. Espera 40 segundos e intenta de nuevo.
                retry_after: 40
                codigo: LIMITE_PETICIONES
                reintentable: true
            limitePruebasDiario:
              summary: Tope diario de pruebas en modo demo (NO reintentable)
              value:
                success: false
                message: Llegaste al máximo de 200 pruebas por día en modo demo. Mañana se reinicia (medianoche, hora de Perú). Las pruebas no gastan créditos; en producción no hay este tope.
                codigo: LIMITE_PRUEBAS_DIARIO
                reintentable: false
                creditos_restantes: 14945
                pruebas_restantes_hoy: 0
                limite_pruebas_diario: 200
    ServerErrorOrRateLimit:
      description: |
        Error interno del servidor (`codigo: ERROR_INTERNO`, reintentable). Los errores técnicos (SQL, PHP)
        se devuelven con un mensaje genérico, nunca con rutas de archivos ni líneas de código.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Ocurrió un error interno. Intenta de nuevo en unos segundos.
            codigo: ERROR_INTERNO
            reintentable: true

  schemas:
    # ───────────── Errores ─────────────
    CodigoError:
      type: string
      description: |
        Código estable del error (ver la tabla "Errores" de la descripción general). La lista puede
        crecer en el futuro: trata un código desconocido según `reintentable`.
      examples: [NO_ENCONTRADO]
      enum:
        - NO_AUTENTICADO
        - PLAN_VENCIDO
        - SIN_CREDITOS
        - RUC_NO_AUTORIZADO
        - RUC_DESACTIVADO
        - LLAVE_DE_PRUEBA_EN_PRODUCCION
        - SIN_PERMISO
        - NO_ENCONTRADO
        - RUTA_NO_ENCONTRADA
        - METODO_NO_PERMITIDO
        - EMISION_EN_CURSO
        - CONFLICTO
        - DATOS_INVALIDOS
        - RUC_REQUERIDO
        - RUC_SIN_TENANT
        - CERTIFICADO_NO_CONFIGURADO
        - ERROR_EMISION
        - RECHAZADO_SUNAT
        - REENVIO_FALLIDO
        - SUNAT_NO_DISPONIBLE
        - LIMITE_PETICIONES
        - LIMITE_PRUEBAS_DIARIO
        - ANULACION_MIXTA
        - ERROR_INTERNO
        - PDF_NO_GENERADO
        - LIMITE_ESTABLECIMIENTOS
        - CATALOGO_NO_DISPONIBLE
    Error:
      type: object
      description: |
        Forma de TODA respuesta de error del API. `success` y `message` se mantienen por compatibilidad;
        decide tu lógica con `codigo` y `reintentable`. Algunos endpoints agregan campos propios.
      required: [success, message, codigo, reintentable]
      properties:
        success: { type: boolean, const: false }
        message: { type: string, description: 'Mensaje legible en español. Puede cambiar de redacción: no lo compares.' }
        codigo: { $ref: '#/components/schemas/CodigoError' }
        reintentable:
          type: boolean
          description: true si repetir la misma petición más tarde puede funcionar (429 LIMITE_PETICIONES, 409 EMISION_EN_CURSO, 5xx, SUNAT_NO_DISPONIBLE). `LIMITE_PRUEBAS_DIARIO` es 429 pero NO es reintentable.
    NoCreditsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [creditos_restantes]
          properties:
            creditos_restantes: { type: integer, const: 0 }
    ValidationError:
      type: object
      description: |
        Error de validación por campo (`codigo: DATOS_INVALIDOS`). `campos` trae el mapa campo → mensajes.
        Por compatibilidad, `message` puede ser ese mismo mapa (petición sin `Accept: application/json`),
        y con `Accept: application/json` el mapa también aparece en la raíz del JSON.
      required: [success, message, codigo, reintentable, campos]
      properties:
        success: { type: boolean, const: false }
        message:
          description: 'Texto, o (sin `Accept: application/json`) el mapa de errores.'
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ValidationErrorMap'
        codigo: { type: string, const: DATOS_INVALIDOS }
        reintentable: { type: boolean, const: false }
        campos: { $ref: '#/components/schemas/ValidationErrorMap' }
      additionalProperties:
        description: 'Con `Accept: application/json`, el mapa de errores también va en la raíz (compatibilidad).'
        type: array
        items: { type: string }
    ValidationErrorMap:
      type: object
      description: 'Mapa campo → lista de mensajes (Laravel). Ejemplo: `{"limite": ["El campo limite no debe ser mayor que 100."]}`.'
      additionalProperties:
        type: array
        items: { type: string }

    # ───────────── Catálogos ─────────────
    EstadoCodigo:
      type: string
      description: 'Estado del comprobante: 01 Registrado, 03 Enviado, 05 Aceptado, 07 Observado, 09 Rechazado, 11 Anulado, 13 Por anular.'
      enum: ["01", "03", "05", "07", "09", "11", "13"]
    TipoDocumentoComprobante:
      type: string
      description: 01 Factura, 03 Boleta de venta, 07 Nota de crédito, 08 Nota de débito.
      enum: ["01", "03", "07", "08"]
    Moneda:
      type: string
      description: Código de moneda (catálogo del RUC; se crea con PEN y USD).
      enum: [PEN, USD]
    AfectacionIgv:
      type: string
      description: |
        Catálogo 07 SUNAT. 10 Gravado onerosa; 11-16 Gravado retiro/bonificación (gratuitas);
        17 IVAP; 20 Exonerado onerosa; 21 Exonerado gratuita; 30 Inafecto onerosa; 31-37 Inafecto
        retiro/gratuita; 40 Exportación.
      enum: ["10", "11", "12", "13", "14", "15", "16", "17", "20", "21", "30", "31", "32", "33", "34", "35", "36", "37", "40"]
    TipoDocumentoIdentidad:
      type: string
      description: 'Catálogo 06 SUNAT: 0 Doc. trib. no domiciliado sin RUC, 1 DNI, 4 Carnet de extranjería, 6 RUC, 7 Pasaporte, A-E otros.'
      enum: ["0", "1", "4", "6", "7", "A", "B", "C", "D", "E"]

    # ───────────── Cobro (común a /documents, /guias, /anulaciones) ─────────────
    CobroOperacion:
      type: object
      description: |
        Campos de cobro de las operaciones que consumen crédito. `modo_demo` y `pruebas_restantes_hoy`
        solo aparecen si la operación fue en un RUC en modo demo (sin costo).
      required: [creditos_restantes, credito_cobrado]
      properties:
        creditos_restantes:
          type: integer
          description: Tu saldo real de créditos después de la operación (en demo no cambia).
        credito_cobrado:
          type: boolean
          description: '`true` si esta operación descontó 1 crédito. En demo siempre `false`; en `/guias` también `false` si la guía no se pudo enviar (se devolvió).'
        modo_demo:
          type: boolean
          const: true
          description: Solo en RUCs demo.
        pruebas_restantes_hoy:
          type: integer
          minimum: 0
          description: Solo en RUCs demo. Operaciones demo que le quedan hoy a la cuenta (tope 200 por día, se reinicia a medianoche hora de Perú).

    # ───────────── Feedback SUNAT (común) ─────────────
    SunatFeedback:
      type: object
      description: Diagnóstico SUNAT que se agrega a las respuestas de comprobantes.
      required: [aceptado_por_sunat, entorno, tiene_validez_fiscal]
      properties:
        sunat:
          description: Código y mensaje de SUNAT guardados para el comprobante (solo si existen).
          type: object
          properties:
            codigo: { type: [string, "null"] }
            descripcion: { type: [string, "null"] }
        aceptado_por_sunat:
          type: boolean
          description: true solo si `estado` es `05`.
        entorno:
          type: string
          enum: [prueba, produccion]
          description: Entorno en el que se emitió ESTE comprobante.
        tiene_validez_fiscal:
          type: boolean
        accion_requerida:
          type: string
          description: Solo en estados `01` y `09`; qué hacer a continuación.

    # ───────────── Utilidades / Cuenta ─────────────
    PingResponse:
      type: object
      required: [success, message, cuenta, creditos, tipo_llave]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        cuenta: { type: [string, "null"], description: 'Nombre de la cuenta API.' }
        creditos: { type: integer, description: 'Créditos disponibles (cupo del plan + bolsa).' }
        tipo_llave:
          type: string
          enum: [prueba, produccion]
          description: 'Llave usada: `prueba` (empieza con `fs_test_`, solo escribe en RUCs en modo demo) o `produccion`.'
        ruc_emisor: { type: [string, "null"], description: 'Solo si se resolvió un RUC.' }
        razon_social: { type: [string, "null"], description: 'Solo si se resolvió un RUC. Es el nombre comercial (`trade_name`) de la empresa.' }
    AccountResponse:
      type: object
      required: [success, cuenta, creditos_disponibles, creditos_recargados_total, creditos_consumidos, plan, rucs]
      properties:
        success: { type: boolean, const: true }
        cuenta: { type: string }
        creditos_disponibles: { type: integer, description: 'Lo que puede emitir ahora (cupo del plan restante este mes + bolsa).' }
        creditos_recargados_total: { type: integer }
        creditos_consumidos: { type: integer }
        plan:
          $ref: '#/components/schemas/PlanSummary'
        rucs:
          type: array
          items:
            type: object
            properties:
              ruc: { type: string }
              nombre: { type: string }
      example:
        success: true
        cuenta: Mi Integración
        creditos_disponibles: 4830
        creditos_recargados_total: 5000
        creditos_consumidos: 170
        plan:
          plan: Pro
          plan_activo: true
          plan_vencido: false
          periodo: mensual
          plan_vence: "2026-10-31"
          cupo_mensual: 1000
          cupo_usado_mes: 120
          cupo_restante_mes: 880
          cupo_se_renueva: "2026-10-15"
          bolsa: 3950
          bolsa_vence: { fecha: "2027-07-08", cantidad: 3950 }
          disponibles: 4830
        rucs:
          - { ruc: "20123456789", nombre: MI EMPRESA S.A.C. }
    PlanSummary:
      type: object
      properties:
        plan: { type: [string, "null"], description: 'Nombre del plan de suscripción, o null.' }
        plan_activo: { type: boolean }
        plan_vencido: { type: boolean, description: 'true si la cuenta tuvo plan y ya venció (no se renovó).' }
        periodo: { type: [string, "null"], enum: [mensual, anual, null] }
        plan_vence: { type: [string, "null"], format: date }
        cupo_mensual: { type: integer }
        cupo_usado_mes: { type: integer }
        cupo_restante_mes: { type: integer }
        cupo_se_renueva: { type: [string, "null"], format: date }
        bolsa: { type: integer, description: 'Créditos de recargas sueltas.' }
        bolsa_vence:
          type: [object, "null"]
          description: Próximo vencimiento de la bolsa.
          properties:
            fecha: { type: string, format: date }
            cantidad: { type: integer }
        disponibles: { type: integer }
    SeriesResponse:
      type: object
      required: [success, series]
      properties:
        success: { type: boolean, const: true }
        series:
          type: array
          items:
            type: object
            properties:
              serie: { type: string, examples: [FA01] }
              codigo_tipo_documento: { type: string, description: 'Tipo de comprobante de la serie (01, 03, 07, 08, 09, 31...).' }
              siguiente_numero: { type: integer }

    # ───────────── Emisión de comprobantes ─────────────
    EmitDocumentRequest:
      type: object
      description: Comprobante (factura, boleta, nota de crédito o débito). Los campos desconocidos se ignoran.
      required:
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - codigo_tipo_moneda
        - datos_del_cliente_o_receptor
        - totales
        - items
      additionalProperties: true
      properties:
        ruc:
          type: string
          pattern: '^\d{11}$'
          description: RUC emisor. Obligatorio si la cuenta tiene varios RUCs.
        codigo_anexo:
          type: string
          pattern: '^\d{4}$'
          description: |
            Código de anexo del local desde el que se emite (ej. `0001`), el de `GET /establecimientos`.
            Si no lo envías: el local dueño de la `serie_documento` enviada o, sin serie, el local
            predeterminado (`0000`). Un código que no existe en el RUC → `422 DATOS_INVALIDOS`.
          examples: ["0001"]
        codigo_establecimiento:
          type: string
          description: Nombre antiguo de `codigo_anexo` (mismo dato; se aceptan los dos). Si envías ambos, gana este.
        serie_documento:
          type: string
          description: Serie (ej. FA01, BA01, FN01). Opcional si el establecimiento tiene una sola serie para el tipo.
        numero_documento:
          type: string
          default: "#"
          description: '`#` para correlativo automático. Un número explícito ya usado da `422`.'
        fecha_de_emision:
          type: string
          format: date
          description: |
            Fecha de emisión (YYYY-MM-DD) **en hora de Perú** (zona `America/Lima`, UTC-5, sin horario
            de verano). Debe ser la fecha real de hoy en Perú. Ojo: un servidor en UTC que use su fecha
            local después de las 19:00 de Perú mandaría la fecha de mañana. Es obligatoria: el API no
            la completa si falta (la emisión se rechaza con `422` y no se cobra).
        hora_de_emision:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: Hora de emisión (HH:MM:SS, 24 h) en hora de Perú (`America/Lima`). Obligatoria; el API no la completa.
        fecha_de_vencimiento:
          type: string
          format: date
          description: Solo facturas/boletas. Si no se envía, se usa la fecha de emisión.
        codigo_tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoComprobante'
        codigo_tipo_operacion:
          type: string
          description: Catálogo 51 SUNAT (0101 venta interna, 0200 exportación, 1001 detracción, 1004 detracción transporte de carga...). Obligatorio en la práctica para 01/03; no aplica a notas.
          examples: ["0101"]
        codigo_tipo_moneda:
          $ref: '#/components/schemas/Moneda'
        factor_tipo_de_cambio:
          type: number
          default: 1
          description: Tipo de cambio de venta.
        numero_orden_de_compra:
          type: string
          description: Referencia de orden de compra (aparece en PDF y XML).
        numero_de_placa:
          type: string
          description: Placa vehicular (ventas de combustible, etc.).
        informacion_adicional:
          type: string
          description: Texto libre que aparece en el PDF y viaja en el XML como nota adicional.
        codigo_condicion_de_pago:
          type: string
          enum: ["01", "02"]
          default: "01"
          description: '`01` Contado, `02` Crédito (requiere `cuotas`). Un texto como "Credito" se ignora y se emite al contado.'
        cuotas:
          type: array
          description: Cuotas del crédito. La suma debe coincidir con `total_venta`.
          items:
            $ref: '#/components/schemas/Cuota'
        pagos:
          type: array
          description: Pagos recibidos (solo 01/03).
          items:
            $ref: '#/components/schemas/Pago'
        datos_del_cliente_o_receptor:
          $ref: '#/components/schemas/Cliente'
        totales:
          $ref: '#/components/schemas/Totales'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemComprobante'
        detraccion:
          $ref: '#/components/schemas/Detraccion'
        percepcion:
          $ref: '#/components/schemas/ImpuestoAdicional'
        retencion:
          $ref: '#/components/schemas/ImpuestoAdicional'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        descuentos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        anticipos:
          type: array
          items:
            $ref: '#/components/schemas/Anticipo'
        guias:
          type: array
          description: Guías de remisión relacionadas.
          items:
            $ref: '#/components/schemas/DocumentoReferencia'
        relacionados:
          type: array
          description: Otros documentos relacionados.
          items:
            allOf:
              - $ref: '#/components/schemas/DocumentoReferencia'
              - type: object
                required: [monto]
                properties:
                  monto: { type: number }
        leyendas:
          type: array
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'
        codigo_tipo_nota:
          type: string
          description: 'Obligatorio en 07/08. Crédito (cat. 09): 01 Anulación de la operación, 07 Devolución por ítem, etc.; débito (cat. 10): 01 Intereses por mora, 02 Aumento en el valor, 03 Penalidades.'
          examples: ["01"]
        motivo_o_sustento_de_nota:
          type: string
          description: Solo 07/08. Motivo de la nota (si se omite queda vacío).
        documento_afectado:
          description: Obligatorio en 07/08 (sin este bloque la emisión de la nota falla con 422).
          allOf:
            - $ref: '#/components/schemas/DocumentoAfectado'
    Cliente:
      type: object
      required: [codigo_tipo_documento_identidad, numero_documento]
      properties:
        codigo_tipo_documento_identidad:
          $ref: '#/components/schemas/TipoDocumentoIdentidad'
        numero_documento: { type: string }
        apellidos_y_nombres_o_razon_social:
          type: string
          description: Opcional con RUC (6) o DNI (1), se autocompleta en SUNAT/RENIEC; obligatorio con otros tipos.
        nombre_comercial: { type: string }
        codigo_pais: { type: string, default: PE }
        ubigeo:
          type: string
          pattern: '^\d{6}$'
          description: Ubigeo de 6 dígitos (se valida contra el catálogo cuando el cliente tiene RUC).
        direccion: { type: string }
        correo_electronico: { type: string, format: email }
        telefono: { type: string }
        codigo_tipo_direccion: { type: string }
    Totales:
      type: object
      required: [total_venta]
      description: Importes del comprobante. Si un total viene en 0 o vacío, el sistema lo recalcula desde los ítems.
      properties:
        total_operaciones_gravadas: { type: number }
        total_operaciones_exoneradas: { type: number }
        total_operaciones_inafectas: { type: number }
        total_operaciones_gratuitas: { type: number }
        total_exportacion: { type: number }
        total_igv: { type: number }
        total_igv_operaciones_gratuitas: { type: number }
        total_base_isc: { type: number }
        total_isc: { type: number }
        total_base_otros_impuestos: { type: number }
        total_otros_impuestos: { type: number }
        total_impuestos_bolsa_plastica: { type: number }
        total_impuestos: { type: number }
        total_valor: { type: number }
        total_anticipos: { type: number }
        total_descuentos: { type: number }
        total_cargos: { type: number }
        subtotal_venta: { type: number, description: 'Si no se envía, se usa `total_venta`.' }
        total_venta: { type: number, description: 'Importe total con impuestos.' }
        total_pendiente_pago: { type: number }
    ItemComprobante:
      type: object
      required: [descripcion, unidad_de_medida, cantidad]
      properties:
        codigo_interno:
          type: string
          description: Código/SKU de tu sistema. Se registra en el catálogo del RUC y se reusa. Sin él, todas las ventas usan un producto genérico compartido.
        descripcion: { type: string, description: 'Descripción que se imprime en el PDF/XML.' }
        nombre: { type: string }
        nombre_secundario: { type: string }
        codigo_tipo_item: { type: string, default: "01" }
        codigo_producto_sunat:
          type: string
          description: |
            Código de producto SUNAT (catálogo 25, UNSPSC, 8 dígitos). Búscalo con
            [`GET /catalogos/productos-sunat`](#operation/searchSunatProductCodes). Opcional: SUNAT
            no lo exige en factura ni boleta.
          example: "43211503"
        unidad_de_medida: { type: string, description: 'Catálogo 03: `NIU` para bienes/productos, `ZZ` para servicios (`KGM`, `LTR`... si vendes por peso o volumen). Lista completa: `GET /catalogos/03`.' }
        cantidad: { type: number }
        valor_unitario: { type: number, description: 'Precio unitario sin IGV.' }
        codigo_tipo_precio: { type: string, description: '01 precio unitario, 02 valor referencial (gratuitas).' }
        precio_unitario: { type: number, description: 'Precio unitario con IGV.' }
        codigo_tipo_afectacion_igv:
          $ref: '#/components/schemas/AfectacionIgv'
        total_base_igv: { type: number }
        porcentaje_igv: { type: number }
        total_igv: { type: number }
        codigo_tipo_sistema_isc: { type: string }
        total_base_isc: { type: number }
        porcentaje_isc: { type: number }
        total_isc: { type: number }
        total_base_otros_impuestos: { type: number }
        porcentaje_otros_impuestos: { type: number }
        total_otros_impuestos: { type: number }
        total_impuestos_bolsa_plastica: { type: number }
        total_impuestos: { type: number }
        total_valor_item: { type: number, description: 'Valor de venta del ítem sin impuestos.' }
        total_cargos: { type: number }
        total_descuentos: { type: number }
        total_item: { type: number, description: 'Total del ítem con impuestos.' }
        informacion_adicional: { type: string }
        actualizar_descripcion:
          type: boolean
          default: true
          description: Si el `codigo_interno` ya existe, actualiza la descripción del producto en el catálogo.
        nombre_producto_pdf: { type: string, description: 'Texto alternativo para el PDF (por defecto, `descripcion`).' }
        nombre_producto_xml: { type: string, description: 'Texto alternativo para el XML (por defecto, `descripcion`).' }
        datos_adicionales:
          type: array
          items:
            type: object
            required: [codigo, descripcion]
            properties:
              codigo: { type: string }
              descripcion: { type: string }
              valor: { type: string }
              fecha_inicio: { type: string, format: date }
              fecha_fin: { type: string, format: date }
              duracion: { type: string }
        descuentos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
    Detraccion:
      type: object
      required: [codigo_tipo_detraccion, porcentaje, monto, codigo_metodo_pago, cuenta_bancaria]
      description: Datos de detracción. La leyenda 2006 se agrega automáticamente.
      properties:
        codigo_tipo_detraccion: { type: string, description: 'Código de bien/servicio (catálogo 54), ej. `022`.' }
        porcentaje: { type: number }
        monto: { type: number, description: 'Porcentaje aplicado sobre el total con IGV, a 2 decimales.' }
        codigo_metodo_pago: { type: string, description: 'Catálogo 59, ej. `001` depósito en cuenta.' }
        cuenta_bancaria: { type: string, description: 'Cuenta de detracciones del Banco de la Nación.' }
        ubigeo_origen: { type: string, pattern: '^\d{6}$', description: 'Obligatorio con operación 1004.' }
        ubigeo_destino: { type: string, pattern: '^\d{6}$', description: 'Obligatorio con operación 1004.' }
        direccion_origen: { type: string }
        direccion_destino: { type: string }
        detalle_viaje: { type: string }
        valor_referencial_carga_util: { type: number }
        valor_referencial_servicio_transporte: { type: number }
        valor_referencia_carga_efectiva: { type: number }
    ImpuestoAdicional:
      type: object
      description: Percepción o retención.
      required: [codigo, porcentaje, monto, base]
      properties:
        codigo: { type: string }
        porcentaje: { type: number }
        monto: { type: number }
        base: { type: number }
    CargoDescuento:
      type: object
      required: [codigo, descripcion, factor, monto, base]
      properties:
        codigo: { type: string, description: 'Catálogo 53 SUNAT.' }
        descripcion: { type: string }
        factor: { type: number }
        monto: { type: number }
        base: { type: number }
    Anticipo:
      type: object
      required: [numero, codigo_tipo_documento, monto, total]
      properties:
        numero: { type: string }
        codigo_tipo_documento: { type: string }
        monto: { type: number }
        total: { type: number }
    DocumentoReferencia:
      type: object
      required: [numero, codigo_tipo_documento]
      properties:
        numero: { type: string }
        codigo_tipo_documento: { type: string }
    Leyenda:
      type: object
      required: [codigo, valor]
      properties:
        codigo: { type: string, description: 'Catálogo 52 SUNAT.' }
        valor: { type: string }
    Acciones:
      type: object
      properties:
        enviar_email: { type: boolean, description: 'Enviar el comprobante por correo al cliente.' }
        enviar_xml_firmado: { type: boolean }
        formato_pdf: { type: string, description: 'Formato del PDF (ej. a4, ticket).' }
    Cuota:
      type: object
      required: [fecha, codigo_tipo_moneda, monto]
      properties:
        fecha: { type: string, format: date, description: 'Fecha de vencimiento de la cuota.' }
        codigo_tipo_moneda:
          $ref: '#/components/schemas/Moneda'
        monto: { type: number }
        codigo_metodo_de_pago: { type: string }
    Pago:
      type: object
      required: [codigo_metodo_pago]
      properties:
        codigo_metodo_pago: { type: string, description: 'Código de método de pago del RUC.' }
        codigo_destino_pago: { type: string }
        referencia: { type: string }
        monto: { type: number, default: 0 }
        pago_recibido: { type: number }
    DocumentoAfectado:
      type: object
      description: |
        Comprobante que corrige la nota. Con `external_id` se enlaza al comprobante emitido en FactuSmart
        (si no existe → `422`). Sin `external_id`, se usan `serie_documento` + `numero_documento` +
        `codigo_tipo_documento` como referencia.
      properties:
        external_id: { type: string, format: uuid }
        serie_documento: { type: string }
        numero_documento: { type: string }
        codigo_tipo_documento: { type: string, enum: ["01", "03"] }

    EmitDocumentResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            serie_numero: { type: string, examples: [FA01-1234] }
            external_id: { type: string, format: uuid }
            sunat:
              description: |
                `{codigo, descripcion}` si hay respuesta SUNAT guardada; si no, la respuesta cruda del
                envío (`code`, `description`, `notes`...) o `[]` si no se envió.
              type: [object, array]
        - $ref: '#/components/schemas/CobroOperacion'
        - $ref: '#/components/schemas/SunatFeedback'

    DocumentListItem:
      allOf:
        - type: object
          properties:
            external_id: { type: string, format: uuid }
            serie_numero: { type: string }
            codigo_tipo_documento:
              $ref: '#/components/schemas/TipoDocumentoComprobante'
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            fecha_emision: { type: [string, "null"], format: date }
            total: { type: number }
        - $ref: '#/components/schemas/SunatFeedback'
    DocumentListResponse:
      type: object
      required: [success, comprobantes, siguiente_cursor]
      properties:
        success: { type: boolean, const: true }
        comprobantes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItem'
        siguiente_cursor:
          type: [integer, "null"]
          description: Pásalo como `antes_de` para la siguiente página. `null` = no hay más.
    DocumentDetailResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id, links]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
            fecha_emision: { type: [string, "null"], format: date }
            total: { type: number }
            links:
              type: object
              description: URLs absolutas de descarga (incluyen `?ruc=` si lo enviaste).
              properties:
                pdf: { type: string, format: uri }
                pdf_ticket: { type: string, format: uri, description: 'El mismo PDF en ticket de 80 mm (`?formato=ticket`).' }
                xml: { type: string, format: uri }
                cdr: { type: string, format: uri }
        - $ref: '#/components/schemas/SunatFeedback'
    ResendResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id]
          properties:
            success: { type: boolean, description: 'Si el reintento se ejecutó sin error de sistema (no implica aceptación).' }
            mensaje: { type: [string, "null"] }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
        - $ref: '#/components/schemas/SunatFeedback'
    QuerySunatResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
            consulta:
              type: [object, "null"]
              description: Respuesta cruda de la consulta de CDR a SUNAT.
        - $ref: '#/components/schemas/SunatFeedback'
    HistoryResponse:
      allOf:
        - type: object
          required: [success, external_id, serie_numero, estado, historial]
          properties:
            success: { type: boolean, const: true }
            external_id: { type: string, format: uuid }
            serie_numero: { type: string }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            historial:
              type: array
              items:
                type: object
                properties:
                  fecha: { type: [string, "null"], description: 'YYYY-MM-DD HH:MM:SS' }
                  evento:
                    type: string
                    enum: [creado, registrado, enviado, aceptado, observado, rechazado, anulado, por_anular, anulacion_enviada, error, reintento]
                    description: '`anulacion_enviada` trae en `detalle` el tipo (`resumen`/`baja`), el `ticket` y el `identificador` (`RC-…`/`RA-…`).'
                  mensaje: { type: [string, "null"] }
                  codigo_sunat: { type: [string, "null"] }
                  detalle: { type: [object, array, "null"] }
        - $ref: '#/components/schemas/SunatFeedback'
    RucOnlyBody:
      type: object
      properties:
        ruc: { type: string, pattern: '^\d{11}$', description: 'RUC emisor (obligatorio si la cuenta tiene varios).' }

    # ───────────── Anulaciones ─────────────
    VoidRequest:
      type: object
      required: [fecha_de_emision_de_documentos, documentos]
      properties:
        ruc: { type: string, pattern: '^\d{11}$' }
        fecha_de_emision_de_documentos:
          type: string
          pattern: '^\d{2}-\d{2}-\d{4}$'
          description: Fecha de emisión de los comprobantes a anular, formato DD-MM-AAAA. Debe coincidir con la de cada uno.
        documentos:
          type: array
          minItems: 1
          items:
            type: object
            required: [external_id, motivo_anulacion]
            properties:
              external_id: { type: string, format: uuid }
              motivo_anulacion: { type: string }
    TipoAnulacion:
      type: string
      enum: [baja, resumen]
      description: '`baja` = comunicación de baja (facturas y sus notas, RA-…); `resumen` = resumen diario de anulación (boletas y sus notas, RC-…).'
    VoidResponse:
      allOf:
        - type: object
          required: [success, message, tipo, ticket, external_id, identificador]
          properties:
            success: { type: boolean, const: true }
            message: { type: string }
            tipo: { $ref: '#/components/schemas/TipoAnulacion' }
            ticket: { type: [string, "null"], description: 'Ticket de SUNAT para `GET /anulaciones/{ticket}/status`.' }
            external_id: { type: string, description: 'Identificador de la anulación (comunicación de baja o resumen).' }
            identificador: { type: [string, "null"], description: 'Número SUNAT de la anulación: `RA-AAAAMMDD-N` (baja) o `RC-AAAAMMDD-N` (resumen).', examples: [RC-20261014-1] }
        - $ref: '#/components/schemas/CobroOperacion'
    VoidStatusResponse:
      type: object
      required: [success, tipo, ticket, estado, external_id, documentos]
      properties:
        success: { type: boolean, const: true }
        tipo: { $ref: '#/components/schemas/TipoAnulacion' }
        ticket: { type: string }
        estado:
          description: 'Estado de la anulación: `05` aceptada por SUNAT, `09` rechazada, `03` enviada.'
          allOf:
            - $ref: '#/components/schemas/EstadoCodigo'
        external_id: { type: string }
        documentos:
          type: array
          description: Cada comprobante incluido en la anulación y su estado actual.
          items:
            type: object
            properties:
              external_id: { type: [string, "null"], format: uuid }
              serie_numero: { type: [string, "null"], examples: [BA01-72] }
              estado:
                description: '`11` anulado (SUNAT aceptó), `13` todavía por anular; `01` si SUNAT rechazó un resumen de boletas.'
                type: [string, "null"]
        sunat:
          type: [object, array, "null"]
          description: Respuesta de SUNAT a la consulta del ticket (la guardada, si SUNAT ya respondió).

    # ───────────── Guías ─────────────
    DispatchGuideRequest:
      type: object
      required:
        - serie_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - datos_del_emisor
        - items
      additionalProperties: true
      properties:
        ruc: { type: string, pattern: '^\d{11}$' }
        serie_documento: { type: string, description: 'Serie de guía (ej. TA01 remitente, VA01 transportista).' }
        numero_documento: { type: string, default: "#" }
        fecha_de_emision: { type: string, format: date }
        hora_de_emision: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        codigo_tipo_documento:
          type: string
          enum: ["09", "31"]
          description: 09 guía del remitente, 31 guía del transportista.
        datos_del_emisor:
          type: object
          required: [codigo_del_domicilio_fiscal]
          properties:
            codigo_del_domicilio_fiscal: { type: string, description: 'Código del establecimiento emisor (`0000` el principal).' }
        datos_del_cliente_o_receptor:
          $ref: '#/components/schemas/Cliente'
        observaciones: { type: string }
        codigo_modo_transporte: { type: string, enum: ["01", "02"], description: '01 público (transportista), 02 privado.' }
        codigo_motivo_traslado: { type: string, description: 'Catálogo 20 (01 venta, 02 compra, 04 traslado entre establecimientos...).' }
        descripcion_motivo_traslado: { type: string }
        fecha_de_traslado: { type: string, format: date }
        indicador_de_transbordo: { type: boolean, default: false }
        codigo_de_puerto: { type: string }
        unidad_peso_total: { type: string, examples: [KGM] }
        peso_total: { type: number }
        numero_de_bultos: { type: integer }
        numero_de_contenedor: { type: string }
        es_traslado_m1l: { type: boolean, default: false, description: 'Vehículo M1 o L (sin conductor ni vehículo).' }
        numero_de_placa_m1l: { type: string }
        direccion_partida:
          $ref: '#/components/schemas/DireccionGuia'
        direccion_llegada:
          $ref: '#/components/schemas/DireccionGuia'
        transportista:
          type: object
          description: Transporte público (modo 01).
          required: [codigo_tipo_documento_identidad, numero_documento, apellidos_y_nombres_o_razon_social, numero_mtc]
          properties:
            codigo_tipo_documento_identidad: { type: string }
            numero_documento: { type: string }
            apellidos_y_nombres_o_razon_social: { type: string }
            numero_mtc: { type: string }
        chofer:
          $ref: '#/components/schemas/Chofer'
        chofer_secundario:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Chofer'
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        vehiculo_secundario:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Vehiculo'
        documento_afectado:
          $ref: '#/components/schemas/DocumentoAfectado'
        documento_relacionado:
          type: array
          items:
            type: object
            properties:
              numero: { type: string }
              empresa: { type: string }
              ruc: { type: string }
              documento:
                type: object
                properties:
                  id: { type: string }
                  descripcion: { type: string }
        datos_remitente:
          $ref: '#/components/schemas/ParteGuia'
        datos_destinatario:
          $ref: '#/components/schemas/ParteGuia'
        pagador_flete:
          type: object
          properties:
            indicador_pagador_flete: { type: string }
            codigo_tipo_documento_identidad: { type: string }
            descripcion_tipo_documento_identidad: { type: string }
            numero: { type: string }
            nombres: { type: string }
        leyendas:
          type: array
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemGuia'
    DireccionGuia:
      type: object
      required: [ubigeo, direccion, codigo_del_domicilio_fiscal]
      properties:
        ubigeo: { type: string, pattern: '^\d{6}$' }
        direccion: { type: string }
        codigo_del_domicilio_fiscal: { type: string, description: 'Código de establecimiento SUNAT del punto (`-` si no aplica).' }
    Chofer:
      type: object
      required: [codigo_tipo_documento_identidad, numero_documento]
      properties:
        codigo_tipo_documento_identidad: { type: string }
        numero_documento: { type: string }
        nombres: { type: string }
        numero_licencia: { type: string }
        telefono: { type: string }
    Vehiculo:
      type: object
      properties:
        numero_de_placa: { type: string }
        modelo: { type: string }
        marca: { type: string }
        certificado_habilitacion_vehicular: { type: string }
    ParteGuia:
      type: object
      required: [codigo_tipo_documento_identidad, descripcion_tipo_documento_identidad, numero_documento, apellidos_y_nombres_o_razon_social]
      properties:
        codigo_tipo_documento_identidad: { type: string }
        descripcion_tipo_documento_identidad: { type: string }
        numero_documento: { type: string }
        apellidos_y_nombres_o_razon_social: { type: string }
    ItemGuia:
      type: object
      required: [descripcion, unidad_de_medida, cantidad]
      description: Ítem trasladado. No lleva precio.
      properties:
        codigo_interno: { type: string, description: 'Código del producto; se crea en el catálogo si no existe.' }
        descripcion: { type: string }
        nombre: { type: string }
        codigo_tipo_item: { type: string, default: "01" }
        codigo_producto_sunat:
          type: string
          description: |
            Código de producto SUNAT (catálogo 25, UNSPSC, 8 dígitos). Búscalo con
            [`GET /catalogos/productos-sunat`](#operation/searchSunatProductCodes). Opcional: SUNAT
            no lo exige en factura ni boleta.
          example: "43211503"
        unidad_de_medida: { type: string }
        cantidad: { type: number }
        informacion_adicional: { type: string }
        dato_adicional: { type: string }
    DispatchResponse:
      allOf:
        - type: object
          required: [success, serie_numero, external_id, enviado, mensaje]
          properties:
            success: { type: boolean, const: true }
            serie_numero: { type: string, examples: [TA01-15] }
            external_id: { type: string, format: uuid }
            enviado: { type: boolean, description: 'true si SUNAT aceptó el envío (solo entonces se cobra el crédito, y solo en un RUC en producción).' }
            mensaje: { type: string }
            envio:
              type: [object, "null"]
              description: Respuesta cruda del envío a SUNAT (`success`, `message`, ticket...).
        - $ref: '#/components/schemas/CobroOperacion'
    DispatchStatusResponse:
      type: object
      required: [success, external_id, estado]
      properties:
        success: { type: boolean, const: true }
        external_id: { type: string, format: uuid }
        estado:
          $ref: '#/components/schemas/EstadoCodigo'
        sunat:
          type: [object, "null"]
          description: Respuesta cruda de la consulta del ticket GRE a SUNAT.

    # ───────────── Herramientas (/calcular, /catalogos) ─────────────
    CalculateRequest:
      type: object
      required: [items]
      properties:
        porcentaje_igv:
          type: number
          enum: [18, 10.5]
          default: 18
          description: |
            IGV de los ítems gravados (afectación `10`). `10.5` = tasa reducida Ley 31556 (restaurantes
            y hoteles MYPE), solo si tu RUC está acogido.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CalculateItem'
    CalculateItem:
      type: object
      description: Envía `valor_unitario` (sin IGV) **o** `precio_unitario` (con IGV), no los dos.
      required: [descripcion, cantidad, afectacion]
      properties:
        descripcion: { type: string, maxLength: 500 }
        cantidad: { type: number, exclusiveMinimum: 0 }
        valor_unitario: { type: number, minimum: 0, description: Precio unitario SIN IGV. }
        precio_unitario: { type: number, minimum: 0, description: Precio unitario CON IGV. }
        afectacion:
          type: string
          enum: ["10", "20", "30", "40"]
          description: '`10` gravado, `20` exonerado, `30` inafecto, `40` exportación. Para otras afectaciones arma el ítem a mano.'
        unidad_de_medida:
          type: string
          default: NIU
          pattern: '^[A-Za-z0-9]{1,5}$'
          description: Código SUNAT del catálogo 03. `NIU` para bienes/productos, `ZZ` para servicios (`KGM`, `LTR`… si vendes por peso o volumen). Lista completa en `GET /catalogos/03` (o `/catalogos/unidades`).
        codigo_interno: { type: string, description: Se copia tal cual al resultado. }
      oneOf:
        - required: [valor_unitario]
        - required: [precio_unitario]
    CalculateResponse:
      type: object
      required: [success, items, totales]
      properties:
        success: { type: boolean, const: true }
        items:
          type: array
          description: Ítems en el formato exacto de `POST /documents` (`items`).
          items:
            $ref: '#/components/schemas/ItemComprobante'
        totales:
          $ref: '#/components/schemas/Totales'
    ToolValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [campos]
          properties:
            campos:
              $ref: '#/components/schemas/ValidationErrorMap'
    CatalogListResponse:
      type: object
      required: [success, catalogos]
      properties:
        success: { type: boolean, const: true }
        catalogos:
          type: array
          items:
            type: object
            required: [nombre, catalogo_sunat, descripcion, url]
            properties:
              nombre: { type: string, examples: [unidades] }
              catalogo_sunat: { type: string, examples: ["03"] }
              descripcion: { type: string }
              url: { type: string, examples: [/api/v1/issuer/catalogos/unidades] }
        nota: { type: string }
    CatalogResponse:
      type: object
      required: [success, catalogo, catalogo_sunat, descripcion, total, datos]
      properties:
        success: { type: boolean, const: true }
        catalogo: { type: string, examples: [unidades] }
        catalogo_sunat: { type: string, examples: ["03"] }
        descripcion: { type: string }
        total: { type: integer }
        datos:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRow'
    SunatProductSearchResponse:
      type: object
      required: [success, catalogo, catalogo_sunat, descripcion, q, total, hay_mas, datos]
      properties:
        success: { type: boolean, const: true }
        catalogo: { type: string, const: productos-sunat }
        catalogo_sunat: { type: string, const: "25" }
        descripcion: { type: string }
        q: { type: string, description: La búsqueda tal como se recibió. }
        total: { type: integer, description: 'Filas devueltas en `datos` (como mucho `limite`).' }
        hay_mas: { type: boolean, description: 'true si hay más resultados que `limite`.' }
        datos:
          type: array
          items:
            type: object
            required: [codigo, descripcion, nivel, categoria]
            properties:
              codigo: { type: string, description: 'Código UNSPSC de 8 dígitos. El de nivel `producto` es el que va en `codigo_producto_sunat`.', examples: ["43211503"] }
              descripcion: { type: string, examples: [Computadores notebook] }
              nivel:
                type: string
                enum: [segmento, familia, clase, producto]
              categoria: { type: [string, "null"], description: 'Ruta en la jerarquía (segmento > familia > clase).' }
    CatalogRow:
      type: object
      required: [codigo, descripcion, activo]
      properties:
        codigo: { type: string }
        descripcion: { type: string }
        activo: { type: boolean, description: Usa solo las filas activas. }
        abreviatura: { type: [string, "null"], description: Solo en tipos-documento. }
        simbolo: { type: [string, "null"], description: Solo en monedas y unidades. }
        es_exportacion: { type: boolean, description: Solo en afectacion-igv y tipos-operacion. }
        es_gratuito: { type: boolean, description: Solo en afectacion-igv. }
        porcentaje: { type: [number, string, "null"], description: Solo en detracciones. }

    # ───────────── RUCs ─────────────
    # ───────────── Anexos (establecimientos) ─────────────
    Establecimiento:
      type: object
      required: [id, codigo_anexo, nombre, predeterminado, series]
      properties:
        id: { type: integer }
        codigo_anexo: { type: string, pattern: '^\d{4}$', description: 'Código de anexo SUNAT del local (`0000` = domicilio fiscal). Es el que envías en `codigo_anexo` al emitir.', examples: ["0001"] }
        nombre: { type: string }
        direccion: { type: [string, "null"] }
        ubigeo: { type: [string, "null"], description: Código INEI del distrito (6 dígitos). }
        departamento: { type: [string, "null"] }
        provincia: { type: [string, "null"] }
        distrito: { type: [string, "null"] }
        telefono: { type: [string, "null"] }
        email: { type: [string, "null"] }
        predeterminado: { type: boolean, description: 'true = el local desde donde emite `POST /documents` si no envías `codigo_anexo`.' }
        series:
          type: array
          description: Series de comprobantes SUNAT del local (01, 03, 07, 08, 09, 31, 20, 40, 04).
          items:
            type: object
            properties:
              serie: { type: string, examples: [BA02] }
              codigo_tipo_documento: { type: string, examples: ["03"] }
              tipo: { type: [string, "null"], examples: [Boleta de venta] }
    EstablishmentListResponse:
      type: object
      required: [success, establecimientos]
      properties:
        success: { type: boolean, const: true }
        establecimientos:
          type: array
          items: { $ref: '#/components/schemas/Establecimiento' }
    CreateEstablishmentRequest:
      type: object
      required: [codigo_anexo, nombre, direccion, ubigeo]
      properties:
        ruc:
          type: string
          pattern: '^\d{11}$'
          description: RUC emisor. Obligatorio si la cuenta tiene varios RUCs.
        codigo_anexo:
          type: string
          pattern: '^\d{4}$'
          description: Código de 4 dígitos que SUNAT asignó al local. Único en el RUC.
        nombre:
          type: string
          description: Nombre del local. Único en el RUC.
        direccion:
          type: string
        ubigeo:
          type: string
          pattern: '^\d{6}$'
          description: Código INEI del distrito, 6 dígitos (ej. `150122` = Miraflores, Lima).
        telefono: { type: string }
        email: { type: string, format: email }
        crear_series_por_defecto:
          type: boolean
          default: true
          description: Crea las series del local igual que el sistema web (`FA0N`, `BA0N`, `FN0N`, `BN0N`, `FD0N`, `BD0N`, guías…).
        series:
          type: array
          maxItems: 20
          description: Series extra del local.
          items:
            type: object
            required: [codigo_tipo_documento, serie]
            properties:
              codigo_tipo_documento: { type: string, enum: ["01", "03", "07", "08"] }
              serie: { type: string, pattern: '^[A-Za-z0-9]{4}$', description: 'Factura `F` + 3, boleta `B` + 3; notas empiezan con `F` o `B`.', examples: [B002] }
    CreateEstablishmentResponse:
      type: object
      required: [success, message, establecimiento]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        establecimiento: { $ref: '#/components/schemas/Establecimiento' }

    RucListResponse:
      type: object
      required: [success, rucs]
      properties:
        success: { type: boolean, const: true }
        rucs:
          type: array
          items:
            type: object
            properties:
              ruc: { type: string }
              nombre: { type: string }
              correo: { type: [string, "null"] }
              entorno:
                type: [string, "null"]
                enum: [demo, produccion, null]
                description: '`demo` = modo prueba (equivale a `entorno: prueba` en los comprobantes). null si el RUC no tiene tenant.'
              activo: { type: boolean }
              creado: { type: [string, "null"], description: 'YYYY-MM-DD HH:MM' }
      example:
        success: true
        rucs:
          - { ruc: "20609999991", nombre: Mi Cliente SAC, correo: contacto@micliente.pe, entorno: demo, activo: true, creado: "2026-07-08 10:30" }
    CreateRucRequest:
      type: object
      required: [ruc, empresa, correo, clave]
      properties:
        ruc: { type: string, pattern: '^\d{11}$', description: 'RUC nuevo (11 dígitos).' }
        empresa: { type: string, maxLength: 255, description: 'Razón social.' }
        correo: { type: string, format: email, description: 'Correo del usuario administrador del panel del RUC.' }
        clave: { type: string, minLength: 6, description: 'Contraseña de acceso al panel del RUC.' }
    CreateRucResponse:
      type: object
      required: [success, ya_existia, ruc, nombre, activo, tenant_url]
      properties:
        success: { type: boolean, const: true }
        ya_existia: { type: boolean }
        ruc: { type: string }
        nombre: { type: string }
        activo: { type: boolean }
        tenant_url: { type: [string, "null"], format: uri, description: 'URL del panel del RUC.' }
        mensaje: { type: string, description: 'Solo cuando se crea (201).' }
      example:
        success: true
        ya_existia: false
        ruc: "20609999991"
        nombre: Mi Cliente SAC
        activo: true
        tenant_url: https://20609999991.s2.factusmart.pe
        mensaje: RUC creado en modo DEMO. Sigue la guía "Pasar a producción" para emitir documentos reales ante SUNAT.
    RucActivationRequest:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean, description: 'false desactiva, true reactiva.' }
    RucActivationResponse:
      type: object
      required: [success, ruc, activo, mensaje]
      properties:
        success: { type: boolean, const: true }
        ruc: { type: string }
        activo: { type: boolean }
        mensaje: { type: string }

    # ───────────── Webhooks ─────────────
    WebhookEvento:
      type: string
      description: |
        `comprobante.aceptado` (05), `comprobante.observado` (07), `comprobante.rechazado` (09),
        `comprobante.anulado` (11) o `prueba` (enviado con el botón "Enviar prueba" del portal).
      enum: [comprobante.aceptado, comprobante.observado, comprobante.rechazado, comprobante.anulado, prueba]
    WebhookComprobante:
      type: object
      description: Cuerpo del aviso. Se firma tal cual se envía (verifica la firma sobre los bytes crudos).
      required: [id, evento, ruc, external_id, serie_numero, tipo_documento, estado, estado_descripcion, aceptado_por_sunat, entorno, sunat, fecha]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único del aviso. Es el mismo en todos los reintentos; úsalo para no procesar dos veces el mismo aviso.
        evento: { $ref: '#/components/schemas/WebhookEvento' }
        ruc: { type: string, description: RUC emisor del comprobante. }
        external_id: { type: string, description: 'El mismo `external_id` que devolvió `POST /documents`.' }
        serie_numero: { type: string, description: 'Serie y número, ej. `F001-123`.' }
        tipo_documento:
          type: string
          enum: ['01', '03', '07', '08']
          description: '`01` factura, `03` boleta, `07` nota de crédito, `08` nota de débito.'
        estado:
          type: string
          enum: ['05', '07', '09', '11']
          description: Estado actual del comprobante.
        estado_descripcion: { type: [string, 'null'], description: 'Descripción del estado, ej. `Aceptado`.' }
        aceptado_por_sunat: { type: boolean, description: '`true` solo si `estado` es `05`.' }
        entorno:
          type: string
          enum: [prueba, produccion]
          description: '`prueba` (beta SUNAT, sin validez fiscal) o `produccion`.'
        sunat:
          type: object
          description: Lo que respondió SUNAT. Ambos campos pueden ser `null`.
          required: [codigo, descripcion]
          properties:
            codigo: { type: [string, 'null'] }
            descripcion: { type: [string, 'null'] }
        fecha:
          type: string
          format: date-time
          description: Momento del cambio de estado (ISO 8601, hora de Lima). No cambia entre reintentos (el último llega ~8,5 h después), así que no descartes avisos por antigüedad; deduplica por `id`.
