                    items:
                      - { codigo_interno: M1, descripcion: Menu, unidad_de_medida: ZZ, cantidad: 3, valor_unitario: 8.47, codigo_tipo_precio: "01", precio_unitario: 10, codigo_tipo_afectacion_igv: "10", total_base_igv: 25.42, porcentaje_igv: 18, total_igv: 4.58, total_impuestos: 4.58, total_valor_item: 25.42, total_item: 30 }
                    totales:
