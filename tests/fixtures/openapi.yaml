  /rucs:
    get:
      operationId: listRucs
      tags: [RUCs]
      summary: Listar RUCs de la cuenta
      description: RUCs enlazados a la cuenta con su entorno (`demo`/`produccion`) y si están activos. No consume crédito.
      responses:
        '200':
          description: Lista de RUCs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RucListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'
    post:
      operationId: createRuc
      tags: [RUCs]
      summary: Crear un RUC
      description: |
        Da de alta un RUC nuevo enlazado a la cuenta (nace en modo prueba/demo). Idempotente: si el RUC
        ya pertenece a esta cuenta devuelve `200` con `ya_existia: true`. Si pertenece a otra cuenta →
        `409`. No consume crédito.

        **Tope de RUCs (ampliable).** Cada cuenta empieza con un tope de **50 RUCs**. Es solo un freno
        de seguridad (que un error en tu sistema no cree empresas en masa), no un límite comercial.
        Al alcanzarlo, esta llamada responde `422` (`codigo: DATOS_INVALIDOS`) con el mensaje
        "Alcanzaste el máximo de N RUCs…". Lo amplías tú mismo, sin costo, de 50 en 50 desde tu portal
        de integrador: **Empresas → Ampliar límite (+50)**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRucRequest'
            example:
              ruc: "20609999991"
              empresa: Mi Cliente SAC
              correo: contacto@micliente.pe
              clave: una-clave-de-al-menos-6-caracteres
      responses:
        '200':
          description: El RUC ya existía en esta cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRucResponse'
        '201':
          description: RUC creado en modo demo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRucResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El RUC ya está registrado con otra cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Ese RUC ya está registrado en el sistema (con otra cuenta).', codigo: CONFLICTO, reintentable: false }
        '422':
          description: Validación fallida, tope de RUCs alcanzado o error al crear el tenant.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                topeAlcanzado:
                  summary: Tope de RUCs alcanzado (amplíalo desde el portal)
                  value: { success: false, message: 'Alcanzaste el máximo de 50 RUCs. Amplíalo tú mismo desde tu portal de integrador (Empresas → Ampliar límite).', codigo: DATOS_INVALIDOS, reintentable: false }
        '500':
          description: Plan de integradores no configurado en el servidor o error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rucs/{ruc}/activation:
