  /anulaciones:
    post:
      operationId: voidDocument
      tags: [Anulaciones]
      summary: Anular comprobantes (facturas o boletas)
      description: |
        Anula comprobantes ante SUNAT y devuelve un `ticket` para consultar el resultado. Es asíncrono:
        el comprobante pasa a `13` (por anular) y queda en `11` (anulado) cuando SUNAT acepta.
        Cuesta 1 crédito (se devuelve si el envío falla; gratis en RUCs demo).

        La API elige el camino según lo que mandes:

        | Mandas | SUNAT lo anula con | `tipo` en la respuesta | `identificador` |
        |---|---|---|---|
        | Facturas y sus notas | Comunicación de baja | `baja` | `RA-AAAAMMDD-N` |
        | Boletas y sus notas | Resumen diario de anulación | `resumen` | `RC-AAAAMMDD-N` |
        | Las dos cosas juntas | — | `422 ANULACION_MIXTA` | — |

        - Boletas: solo se anulan las **aceptadas** por SUNAT (estado `05`). Otra → `422 DATOS_INVALIDOS`.
        - No mezcles facturas y boletas en la misma petición: haz una petición para cada tipo.
        - `fecha_de_emision_de_documentos` en formato **DD-MM-AAAA** y debe ser **exactamente** la
          fecha de emisión de cada comprobante listado (todos deben compartirla).
        - Plazo: el que tenga configurado la empresa para anular (por defecto **7 días** desde la
          emisión, el plazo de SUNAT). Fuera de plazo → `422` (`El documento excede los 7 días válidos para ser anulado.`).
        - Requiere certificado digital configurado en el RUC (o envío por PSE).
        - Cada comprobante deja en su historial el evento `anulacion_enviada` (con tipo, ticket e identificador).
      parameters:
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
            example:
              ruc: "20123456789"
              fecha_de_emision_de_documentos: "08-07-2026"
              documentos:
                - external_id: 9822f52c-108e-47ff-9d2e-5f0c3c1a7b11
                  motivo_anulacion: Error en el comprobante
      responses:
        '200':
          description: Anulación enviada a SUNAT (comunicación de baja o resumen de boletas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
              examples:
                facturaProduccion:
                  summary: Factura en un RUC en producción (comunicación de baja)
                  value:
                    success: true
                    message: Anulación enviada a SUNAT. Consulta el resultado con el ticket.
                    tipo: baja
                    ticket: "1792012278123"
                    external_id: 5b1d0e7a-3c2f-4a51-9d1e-2f6a7c8b9d10
                    identificador: RA-20261014-1
                    creditos_restantes: 4829
                    credito_cobrado: true
                boletaDemo:
                  summary: Boleta en un RUC demo (resumen diario, sin costo)
                  value:
                    success: true
                    message: Anulación enviada a SUNAT. Consulta el resultado con el ticket.
                    tipo: resumen
                    ticket: "1792012278669"
                    external_id: 87c0049e-1225-43af-8a0a-7d2a7d8d32ab
                    identificador: RC-20261014-1
                    creditos_restantes: 14945
                    credito_cobrado: false
                    modo_demo: true
                    pruebas_restantes_hoy: 197
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/NoCredits'
        '403':
          $ref: '#/components/responses/RucForbiddenOrTestKey'
        '422':
          description: |
            Falta el RUC, facturas y boletas mezcladas (`ANULACION_MIXTA`), payload inválido (p. ej.
            `El código externo ... no fue encontrado o la fecha indica no corresponde al documento.`),
            boleta no aceptada, fuera de plazo, certificado no encontrado, o error al generar/enviar
            la anulación. El crédito no se cobra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                mixta:
                  summary: Facturas y boletas en la misma petición
                  value:
                    success: false
                    message: 'No se pueden anular facturas y boletas en la misma petición: SUNAT las anula por caminos distintos (comunicación de baja para facturas, resumen diario para boletas). Envía una petición para las facturas y otra para las boletas.'
                    codigo: ANULACION_MIXTA
                    reintentable: false
                boletaNoAceptada:
                  summary: Boleta que no está aceptada por SUNAT
                  value:
                    success: false
                    message: 'La boleta BA01-72 no se puede anular: su estado es "Anulado". Solo se anulan boletas aceptadas por SUNAT (estado 05).'
                    codigo: DATOS_INVALIDOS
                    reintentable: false
                fueraDePlazo:
                  summary: Fuera del plazo de anulación
                  value:
                    success: false
                    message: El documento excede los 7 días válidos para ser anulado.
                    codigo: DATOS_INVALIDOS
                    reintentable: false
        '429':
          $ref: '#/components/responses/RateLimitedOrDemoLimit'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /anulaciones/{ticket}/status:
    get:
      operationId: getVoidStatus
      tags: [Anulaciones]
      summary: Estado de una anulación
      description: |
        Consulta el resultado de la anulación (comunicación de baja o resumen de boletas) asociada al
        ticket. Si SUNAT ya respondió, devuelve esa respuesta guardada sin volver a preguntar. No
        consume crédito.

        - `estado` es el de la anulación: `05` aceptada por SUNAT, `09` rechazada, `03` enviada.
        - `documentos[].estado` es el de cada comprobante: `11` anulado, `13` todavía por anular.
        - Si SUNAT rechaza un resumen de boletas, las boletas vuelven a `01`.
      parameters:
        - name: ticket
          in: path
          required: true
          description: Ticket devuelto por `POST /anulaciones`.
          schema: { type: string }
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Resultado de la consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidStatusResponse'
              example:
                success: true
                tipo: resumen
                ticket: "1792012278669"
                estado: "05"
                external_id: 87c0049e-1225-43af-8a0a-7d2a7d8d32ab
                documentos:
                  - external_id: a3af5a50-dfe9-41e9-a4be-6de52c0b5c61
                    serie_numero: BA01-72
                    estado: "11"
                sunat:
                  sent: true
                  code: "0"
                  description: El Resumen diario RC-20261014-1, ha sido aceptado
                  notes: []
                  is_accepted: true
                  status_code: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: No existe una anulación con ese ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Anulación no encontrada para ese ticket.', codigo: NO_ENCONTRADO, reintentable: false }
        '422':
          description: Falta el RUC o la consulta a SUNAT falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /guias:
    post:
      operationId: emitDispatchGuide
      tags: [Guías de remisión]
      summary: Emitir guía de remisión (GRE 2.0)
      description: |
        Genera, firma y crea el PDF de la guía; luego la envía a SUNAT (proceso asíncrono). Cuesta
        1 crédito solo si el envío a SUNAT tiene éxito; si no se pudo enviar, la guía queda creada,
        `enviado` es `false` y el crédito se devuelve (respuesta `200`).

        - Requiere certificado digital y credenciales GRE de SUNAT configurados en el RUC.
        - Envía siempre `serie_documento` (ej. `TA01` remitente, `VA01` transportista).
        - El establecimiento se indica con `datos_del_emisor.codigo_del_domicilio_fiscal` (no con
          `codigo_establecimiento`).
        - Para `09` (remitente) el bloque `datos_del_cliente_o_receptor` es obligatorio.
        - No usa `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchGuideRequest'
            examples:
              remitenteTransportePrivado:
                summary: Guía del remitente, transporte privado
                value:
                  ruc: "20123456789"
                  serie_documento: TA01
                  numero_documento: "#"
                  fecha_de_emision: "2026-07-08"
                  hora_de_emision: "10:30:00"
                  codigo_tipo_documento: "09"
                  datos_del_emisor: { codigo_del_domicilio_fiscal: "0000" }
                  datos_del_cliente_o_receptor:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20555555555"
                    apellidos_y_nombres_o_razon_social: EMPRESA DESTINO S.A.C.
                  codigo_motivo_traslado: "01"
                  descripcion_motivo_traslado: Venta
                  fecha_de_traslado: "2026-07-08"
                  peso_total: 50
                  unidad_peso_total: KGM
                  numero_de_bultos: 2
                  codigo_modo_transporte: "02"
                  direccion_partida:
                    ubigeo: "150101"
                    direccion: Av. Partida 123 - Lima
                    codigo_del_domicilio_fiscal: "0000"
                  direccion_llegada:
                    ubigeo: "150203"
                    direccion: Av. Llegada 456 - Barranca
                    codigo_del_domicilio_fiscal: "-"
                  vehiculo: { numero_de_placa: ABC123 }
                  chofer:
                    codigo_tipo_documento_identidad: "1"
                    numero_documento: "12345678"
                    nombres: Juan Pérez
                    numero_licencia: Q12345678
                  items:
                    - codigo_interno: PROD-001
                      descripcion: Producto trasladado
                      unidad_de_medida: NIU
                      cantidad: 10
      responses:
        '200':
          description: Guía creada (revisa `enviado`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/NoCredits'
        '403':
          $ref: '#/components/responses/RucForbiddenOrTestKey'
        '422':
          description: Falta el RUC, payload inválido, certificado no encontrado o error al generar la guía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitedOrDemoLimit'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /guias/{external_id}/status:
    get:
      operationId: getDispatchGuideStatus
