          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RucActivationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TestKeyInProduction'
        '404':
          description: El RUC no pertenece a la cuenta o no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Ese RUC no pertenece a esta cuenta o no existe.', codigo: NO_ENCONTRADO, reintentable: false }
        '422':
