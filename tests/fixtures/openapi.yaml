  /establecimientos:
    get:
      operationId: listEstablishments
      tags: [Anexos]
      summary: Listar locales (anexos) del RUC
      description: |
        Locales del RUC registrados en FactuSmart, con su código de anexo SUNAT y sus series de
        comprobantes (01, 03, 07, 08, 09, 31, 20, 40, 04). `predeterminado: true` = el local desde
        donde emite `POST /documents` si no envías `codigo_anexo`. Requiere RUC. No consume crédito.
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Locales del RUC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentListResponse'
              example:
                success: true
                establecimientos:
                  - id: 1
                    codigo_anexo: "0000"
                    nombre: Oficina Principal
                    direccion: Av. Arequipa 1234
                    ubigeo: "150101"
                    departamento: LIMA
                    provincia: Lima
                    distrito: Lima
                    telefono: null
                    email: ventas@miempresa.pe
                    predeterminado: true
                    series:
                      - { serie: FA01, codigo_tipo_documento: "01", tipo: Factura }
                      - { serie: BA01, codigo_tipo_documento: "03", tipo: Boleta de venta }
                  - id: 2
                    codigo_anexo: "0001"
                    nombre: Tienda Miraflores
                    direccion: Av. Larco 345
                    ubigeo: "150122"
                    departamento: LIMA
                    provincia: Lima
                    distrito: Miraflores
                    telefono: "014445566"
                    email: null
                    predeterminado: false
                    series:
                      - { serie: FA02, codigo_tipo_documento: "01", tipo: Factura }
                      - { serie: B002, codigo_tipo_documento: "03", tipo: Boleta de venta }
                      - { serie: BA02, codigo_tipo_documento: "03", tipo: Boleta de venta }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'
    post:
      operationId: createEstablishment
      tags: [Anexos]
      summary: Crear un local (anexo)
      description: |
        Crea un local del RUC con su almacén y sus series, igual que el sistema web (Empresa →
        Establecimientos) y con sus mismas reglas. No consume crédito.

        - Registra antes el anexo en SUNAT (Clave SOL): el API no lo da de alta en SUNAT.
        - `codigo_anexo` (4 dígitos) y `nombre` deben ser únicos dentro del RUC.
        - `crear_series_por_defecto` (por defecto `true`) crea las series del local como la web
          (`FA0N`, `BA0N`, `FN0N`, `BN0N`, `FD0N`, `BD0N`, guías…). Con `false` solo se crean el
          almacén y las `series` que envíes.
        - `series` agrega series propias (máx. 20; tipos `01`, `03`, `07`, `08`; 4 caracteres; factura
          `F` + 3, boleta `B` + 3; las notas empiezan con `F` o `B`). Una serie ya usada en el RUC → `422`.
        - El plan del RUC limita cuántos locales puede tener → `403 LIMITE_ESTABLECIMIENTOS`.
        - Con la llave de prueba (`fs_test_…`) solo en RUCs en modo demo; en producción →
          `403 LLAVE_DE_PRUEBA_EN_PRODUCCION`.
        - Editar o eliminar un local se hace desde el sistema web.
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEstablishmentRequest'
            example:
              ruc: "20123456789"
              codigo_anexo: "0001"
              nombre: Tienda Miraflores
              direccion: Av. Larco 345
              ubigeo: "150122"
              telefono: "014445566"
              series:
                - { codigo_tipo_documento: "03", serie: B002 }
      responses:
        '201':
          description: Local creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEstablishmentResponse'
              example:
                success: true
                message: 'Establecimiento creado. Para emitir desde él envía "codigo_anexo": "0001" en POST /documents.'
                establecimiento:
                  id: 2
                  codigo_anexo: "0001"
                  nombre: Tienda Miraflores
                  direccion: Av. Larco 345
                  ubigeo: "150122"
                  departamento: LIMA
                  provincia: Lima
                  distrito: Miraflores
                  telefono: "014445566"
                  email: null
                  predeterminado: false
                  series:
                    - { serie: FA02, codigo_tipo_documento: "01", tipo: Factura }
                    - { serie: B002, codigo_tipo_documento: "03", tipo: Boleta de venta }
                    - { serie: BA02, codigo_tipo_documento: "03", tipo: Boleta de venta }
                    - { serie: BN02, codigo_tipo_documento: "07", tipo: Nota de crédito }
                    - { serie: FN02, codigo_tipo_documento: "07", tipo: Nota de crédito }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El RUC no pertenece a la cuenta o está desactivado, llave de prueba en un RUC en producción,
            o el plan del RUC no permite más locales (`LIMITE_ESTABLECIMIENTOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limite:
                  summary: Límite de locales del plan
                  value: { success: false, message: 'Ha alcanzado el límite de 1 sucursal(es) permitidas por su plan. Elimine una sucursal o amplíe su plan.', codigo: LIMITE_ESTABLECIMIENTOS, reintentable: false }
                llavePrueba:
                  value: { success: false, message: 'Estás usando tu llave de PRUEBA y este RUC está en producción. La llave de prueba solo emite, anula y reenvía en RUCs en modo demo. Usa tu llave de producción.', codigo: LLAVE_DE_PRUEBA_EN_PRODUCCION, reintentable: false }
                ajeno:
                  value: { success: false, message: 'El RUC indicado no pertenece a esta cuenta o no existe.', codigo: RUC_NO_AUTORIZADO, reintentable: false }
        '422':
          description: Falta el RUC, o los datos no pasan la validación (detalle por campo en `campos`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                validacion:
                  value:
                    success: false
                    message: 'Datos inválidos: …'
                    codigo: DATOS_INVALIDOS
                    reintentable: false
                    campos:
                      nombre: [Ya existe un establecimiento con ese nombre.]
                      ubigeo: ['ubigeo inválido: envía el código de distrito INEI de 6 dígitos (ej. 150122 = Miraflores, Lima).']
                      direccion: [El campo direccion es obligatorio.]
                      codigo_anexo: ['codigo_anexo debe ser el código de 4 dígitos que SUNAT asignó al local (ej. "0001"; "0000" es el domicilio fiscal).']
                      series.0.serie: ['El formato de la serie es inválido - Formato del campo: [B][A-Z0-9]{3}, Ejemplo: B001']
                      series.1.serie: [La serie FA01 ya ha sido registrada en este RUC.]
                      series.2.codigo_tipo_documento: ['Debe ser uno de: 01, 03, 07, 08.']
                rucRequerido:
                  value: { success: false, message: 'Indica el RUC emisor en el campo "ruc" (tu cuenta tiene varios RUCs enlazados).', codigo: RUC_REQUERIDO, reintentable: false }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /calcular:
    post:
      operationId: calculateDocument
      tags: [Herramientas]
      summary: Calcular importes (items y totales) sin emitir
      description: |
        Arma `items` y `totales` listos para copiar tal cual en `POST /documents`, para que no tengas
        que calcular el IGV a mano. **No emite nada ni consume crédito** y no necesita RUC (aunque
        mandes `ruc` o `X-RUC`, no se usa).

        Da exactamente el mismo resultado que `calcularComprobante()` / `calcular_comprobante()` de
        los SDK: redondeo half-up a 2 decimales por ítem y aritmética decimal exacta.

        - Con `valor_unitario` (sin IGV): `base = redondeo(valor × cantidad)`,
          `igv = redondeo(base × porcentaje)`, `total = base + igv`.
        - Con `precio_unitario` (con IGV) se respeta lo que paga el cliente:
          `total = redondeo(precio × cantidad)`, `base = redondeo(total ÷ (1 + porcentaje))`,
          `igv = total − base`. Así 3 menús de S/ 10.00 suman S/ 30.00 y no S/ 29.99.
        - Afectación `40` (exportación) suma en `total_exportacion` con IGV 0. Una exportación
          necesita factura con `codigo_tipo_operacion` `0200`.
        - **Descuentos: todavía no.** Si mandas `descuento` en un ítem → `422`. Envía el precio ya
          descontado.
        - Para otras afectaciones (gratuitas, ISC, ICBPER…) arma el ítem a mano.

        Flujo típico: `POST /calcular` → copia `items` y `totales` → `POST /documents` con tu cabecera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequest'
            examples:
              casoComun:
                summary: Gravado, exonerado, inafecto y exportación (valor sin IGV)
                value:
                  items:
                    - { descripcion: A, cantidad: 3, valor_unitario: 10.555, afectacion: "10" }
                    - { descripcion: B, cantidad: 2, valor_unitario: 5, afectacion: "20" }
                    - { descripcion: C, cantidad: 1, valor_unitario: 7.1, afectacion: "30" }
                    - { descripcion: D, cantidad: 1, valor_unitario: 100, afectacion: "40" }
              precioConIgv:
                summary: Precio con IGV (lo que paga el cliente)
                value:
                  items:
                    - { codigo_interno: M1, descripcion: Menu, cantidad: 3, precio_unitario: 10, afectacion: "10", unidad_de_medida: ZZ }
              tasaReducida:
                summary: Tasa reducida Ley 31556 (10.5 %)
                value:
                  porcentaje_igv: 10.5
                  items:
                    - { descripcion: Menu, cantidad: 1, valor_unitario: 100, afectacion: "10" }
      responses:
        '200':
          description: Items y totales calculados, listos para `POST /documents`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponse'
              examples:
                casoComun:
                  summary: Respuesta del caso común
                  value:
                    success: true
                    items:
                      - { descripcion: A, unidad_de_medida: NIU, cantidad: 3, valor_unitario: 10.56, codigo_tipo_precio: "01", precio_unitario: 12.45, codigo_tipo_afectacion_igv: "10", total_base_igv: 31.67, porcentaje_igv: 18, total_igv: 5.7, total_impuestos: 5.7, total_valor_item: 31.67, total_item: 37.37 }
                      - { descripcion: B, unidad_de_medida: NIU, cantidad: 2, valor_unitario: 5, codigo_tipo_precio: "01", precio_unitario: 5, codigo_tipo_afectacion_igv: "20", total_base_igv: 10, porcentaje_igv: 0, total_igv: 0, total_impuestos: 0, total_valor_item: 10, total_item: 10 }
                      - { descripcion: C, unidad_de_medida: NIU, cantidad: 1, valor_unitario: 7.1, codigo_tipo_precio: "01", precio_unitario: 7.1, codigo_tipo_afectacion_igv: "30", total_base_igv: 7.1, porcentaje_igv: 0, total_igv: 0, total_impuestos: 0, total_valor_item: 7.1, total_item: 7.1 }
                      - { descripcion: D, unidad_de_medida: NIU, cantidad: 1, valor_unitario: 100, codigo_tipo_precio: "01", precio_unitario: 100, codigo_tipo_afectacion_igv: "40", total_base_igv: 100, porcentaje_igv: 0, total_igv: 0, total_impuestos: 0, total_valor_item: 100, total_item: 100 }
                    totales:
                      total_operaciones_gravadas: 31.67
                      total_operaciones_exoneradas: 10
                      total_operaciones_inafectas: 7.1
                      total_exportacion: 100
                      total_igv: 5.7
                      total_impuestos: 5.7
                      total_valor: 148.77
                      total_venta: 154.47
                precioConIgv:
                  summary: Respuesta con precio con IGV (3 × S/ 10.00 = S/ 30.00)
                  value:
