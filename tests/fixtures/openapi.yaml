openapi: 3.1.0

info:
  title: API de Facturación Electrónica FactuSmart
  version: "1.0.0"
  summary: Emisión de comprobantes electrónicos SUNAT (Perú) para integradores.
  contact:
    name: FactuSmart
    url: https://factusmart.pe/api-facturacion-electronica/docs
  license:
    # API propietaria (no es software libre). No hay licencia SPDX publicada que aplique:
    # `LicenseRef-*` es la forma SPDX de nombrar una licencia propia no listada.
    name: Propietario — uso sujeto a los términos de servicio de FactuSmart
    identifier: LicenseRef-FactuSmart-Propietario
  description: |
    API REST para que sistemas de terceros emitan **facturas, boletas, notas de crédito/débito,
    guías de remisión (GRE 2.0) y anulaciones** (comunicación de baja para facturas, resumen diario
    para boletas) ante SUNAT, y descarguen el PDF, el XML firmado y el CDR. Tú envías la venta en
    JSON; FactuSmart arma el XML UBL 2.1, lo firma y lo envía.

    **¿No quieres calcular el IGV a mano?** `POST /calcular` te devuelve `items` y `totales` listos
    para copiar en `POST /documents`. Los códigos SUNAT (unidades, afectación, motivos…) están en
    `GET /catalogos`. Ninguno de los dos consume crédito.

    **¿Integras con un agente de IA (Claude, ChatGPT, Cursor)?** Dale este enlace, que trae toda la
    documentación en un solo archivo Markdown:
    https://factusmart.pe/api-facturacion-electronica/llms-full.txt

    Todas las respuestas son **JSON** (`Content-Type: application/json`), salvo las descargas de
    archivos (`/documents/{external_id}/{type}`), que devuelven el archivo (y un error JSON `404` si
    el comprobante o el archivo no existen).

    ## Autenticación

    Toda petición lleva tu API key en el header:

    ```
    X-API-Key: TU_API_KEY
    ```

    Como alternativa, el middleware también acepta `Authorization: Bearer TU_API_KEY`.
    Sin key → `401`. Key inválida o cuenta desactivada → `401`.

    ### Llave de prueba y llave de producción

    Cada cuenta puede tener **dos llaves**, que se envían igual y usan la **misma URL base**:

    | | Llave de producción | Llave de prueba |
    |---|---|---|
    | Formato | 64 letras y números (la de siempre) | Empieza con `fs_test_` |
    | Dónde se obtiene | Portal → Configuración | Portal → Configuración → "Generar llave de prueba" |
    | Emitir, anular, guías, `/reenviar`, `/consultar-sunat` | En todos tus RUCs | **Solo en RUCs en modo demo** |
    | Consultar, listar, descargar, historial, series, cuenta, ping | Todos tus RUCs | Todos tus RUCs |
    | Crear y listar RUCs (`/rucs`) | Sí | Sí |
    | Activar/desactivar un RUC | Sí | Solo si el RUC está en modo demo |
    | Créditos | 1 por operación en RUCs en producción; **gratis en RUCs demo** (tope 200/día) | Gratis (solo opera en RUCs demo; tope 200/día) |
    | Límite de peticiones | 120/min | 120/min (contador propio) |

    La llave de prueba es **opcional**: si ya integraste con tu llave de siempre, esa es tu llave de
    producción y sigue funcionando igual. Úsala en desarrollo y staging para que tu sistema de pruebas
    **nunca pueda emitir por error un comprobante real**: si apunta a un RUC en producción, la API
    responde `403` con `codigo: LLAVE_DE_PRUEBA_EN_PRODUCCION` en vez de enviarlo a SUNAT. El control
    es inmediato: si un RUC pasa de demo a producción, la llave de prueba deja de poder emitir en él al
    instante. `GET /ping` te dice qué llave usas (`tipo_llave`: `prueba`/`produccion`). Cada llave
    se regenera por separado en el portal y la anterior deja de funcionar al momento.

    El campo `entorno` de los comprobantes no depende de la llave: indica en qué entorno de SUNAT
    salió **ese** comprobante.

    ## Cuenta y RUCs

    Una **cuenta API** tiene una bolsa de créditos compartida y puede emitir para uno o varios RUCs.
    El RUC emisor se elige con (en este orden de prioridad):

    1. el campo `ruc` (en el body JSON o como query `?ruc=`),
    2. el campo `emisor_ruc` (alias),
    3. el header `X-RUC`.

    Si no indicas RUC y la cuenta tiene **un solo** RUC, se usa ese automáticamente. Si tiene varios y
    no indicas cuál, los endpoints que operan sobre un RUC responden `422`. Un RUC que no pertenece a la
    cuenta → `403`. Un RUC desactivado → `403`. Los endpoints `/rucs*` nunca resuelven RUC (gestionan
    la cuenta).

    Cada cuenta empieza con un tope de **50 RUCs** (freno de seguridad, no límite comercial). Lo
    amplías tú mismo de 50 en 50 desde tu portal de integrador: **Empresas → Ampliar límite (+50)**.
    Ver `POST /rucs`.

    ## Varios locales (anexos)

    Un RUC puede emitir desde varios locales registrados en SUNAT. Cada local (establecimiento) tiene
    un **código de anexo de 4 dígitos** (`0000` = domicilio fiscal) y **sus propias series**; su
    dirección sale en el XML y en el PDF del comprobante.

    - `GET /establecimientos` lista los locales del RUC con sus series. `predeterminado: true` marca
      el local desde donde se emite si no indicas otro.
    - `POST /establecimientos` crea un local (y sus series). Antes regístralo en SUNAT (Clave SOL):
      el API no lo da de alta en SUNAT. Editar o eliminar un local se hace desde el sistema web
      (Empresa → Establecimientos).
    - Para emitir desde un local, en `POST /documents` envía `codigo_anexo` (ej. `"0001"`; también
      se acepta el nombre antiguo `codigo_establecimiento`), **o** solo una serie de ese local en
      `serie_documento` (ej. `"BA02"`): el sistema usa el local dueño de esa serie. Sin ninguno de los
      dos se emite desde el local predeterminado, como siempre.

    Ninguno de estos endpoints consume crédito.

    ## Créditos

    Todo es prepago. Cuesta **1 crédito**: cada comprobante emitido (`POST /documents`), cada guía
    **enviada** a SUNAT (`POST /guias`) y cada anulación **enviada** (`POST /anulaciones`), **en un
    RUC en producción**. En un RUC en **modo demo** no se cobra nada (ver "Pruebas sin costo").
    El crédito se reserva de forma atómica antes de emitir/enviar y se **devuelve** si la operación
    falla con error (respuesta `422`). Ojo: si el comprobante se genera pero SUNAT no lo acepta
    (queda en estado `01`), la respuesta es `200` y el crédito **sí** se cobra; se reintenta gratis con
    `/reenviar`. Consultar, listar, descargar, ver saldo, `/calcular` y `/catalogos` es gratis.
    Sin saldo → `402`.

    Las respuestas de `POST /documents`, `POST /guias` y `POST /anulaciones` traen
    `creditos_restantes` (tu saldo real tras la operación) y `credito_cobrado` (`true` si esta
    operación descontó 1 crédito; en demo siempre `false`; en `/guias`, `false` también si la guía
    no se pudo enviar y se devolvió).

    ### Pruebas sin costo (RUC en modo demo)

    En un RUC en modo demo (SUNAT beta) emitir, enviar guías y anular **no gasta créditos**, con
    cualquiera de tus dos llaves: lo que decide es el modo del RUC, no la llave. La respuesta lo dice:

    ```json
    { "creditos_restantes": 14945, "credito_cobrado": false, "modo_demo": true, "pruebas_restantes_hoy": 198 }
    ```

    - `creditos_restantes` es tu saldo real (no cambia en demo).
    - `modo_demo` y `pruebas_restantes_hoy` solo aparecen cuando la operación fue en un RUC demo.
    - Tope: **200 operaciones en demo por cuenta y por día** (emisiones + guías + anulaciones, todas
      tus empresas juntas). Al pasarlo la API responde `429` con `codigo: LIMITE_PRUEBAS_DIARIO` y
      `reintentable: false`: reintentar hoy no sirve, el cupo se reinicia a medianoche (hora de Perú).
      En producción no hay este tope.
    - Una operación que falla (`422`) no cuenta para el tope.

    ## Modo prueba vs producción (por RUC)

    Cada RUC **nace en modo prueba** (SUNAT beta, sin validez fiscal): se puede integrar sin
    certificado ni clave SOL. El paso a producción se hace por RUC desde su panel
    (`https://{RUC}.{servidor}.factusmart.pe`). La misma API key y los mismos endpoints sirven en ambos
    modos. Cada comprobante informa en qué entorno salió (`entorno`: `prueba`/`produccion`,
    `tiene_validez_fiscal`).

    ## Idempotencia

    `POST /documents` acepta el header `Idempotency-Key` (único por venta). Si reintentas con la misma
    key y la emisión ya terminó, recibes la **misma respuesta** sin reemitir ni recobrar. Si la primera
    petición aún se procesa → `409`. Si la emisión falló (`402`/`422`), la key se libera y puedes
    reintentar con ella. Solo existe en `POST /documents`.

    ## Webhooks (avisos de cambio de estado)

    En vez de consultar `GET /documents/{external_id}` cada cierto tiempo, puedes recibir un **POST
    firmado** en tu servidor cuando un comprobante **emitido por el API** pasa a aceptado (`05`),
    observado (`07`), rechazado (`09`) o anulado (`11`). Se configura **una URL por cuenta** (recibes
    los avisos de todos tus RUCs) en tu portal de integrador, pestaña **Webhooks**; ahí obtienes el
    secreto `whsec_…` y puedes enviar un aviso de prueba. No hay endpoint del API para configurarlo.

    - Firma: header `X-FactuSmart-Firma` = HMAC-SHA256 (hex) del **cuerpo crudo** con tu secreto.
      Los SDK traen `verificarFirmaWebhook` / `verificar_firma_webhook`.
    - Responde `2xx` en menos de **8 segundos**. Si no, se reintenta: 6 intentos en total
      (inmediato, +1 min, +5 min, +30 min, +2 h, +6 h). No se siguen redirecciones.
    - El `id` del aviso es el mismo en todos los reintentos: úsalo para no procesarlo dos veces.

    El detalle del payload y los headers está en la sección `webhooks` (`comprobanteEstado`).

    ## HTTP 200 no significa "aceptado por SUNAT"

    En emisión y consultas revisa siempre `aceptado_por_sunat` y `estado`
    (`01` Registrado, `03` Enviado, `05` Aceptado, `07` Observado, `09` Rechazado, `11` Anulado,
    `13` Por anular).

    ## Límites de uso

    - `120` peticiones/minuto **por API key** (limitador `issuer`).
    - Además, el grupo de rutas `api` aplica `60` peticiones/minuto **por IP** antes de autenticar.

    Al superar cualquiera de los dos límites la respuesta es **HTTP 429** con el header `Retry-After`
    (segundos) y `{"success": false, "message": "Demasiadas peticiones. Espera N segundos e intenta de nuevo.", "retry_after": N, "codigo": "LIMITE_PETICIONES", "reintentable": true}`.
    Espera esos segundos y reintenta.

    Hay **otro** `429` que **no** se reintenta: `LIMITE_PRUEBAS_DIARIO` (tope de 200 operaciones
    diarias en RUCs demo). Decide siempre por `codigo`/`reintentable`, no solo por el HTTP.

    ## Errores

    Toda respuesta de error (HTTP `4xx`/`5xx`) tiene la misma forma base (schema `Error`):

    ```json
    {"success": false, "message": "Comprobante no encontrado.", "codigo": "NO_ENCONTRADO", "reintentable": false}
    ```

    - `message`: texto en español para mostrar o registrar. **No lo compares**: puede cambiar de redacción.
    - `codigo`: identificador estable en MAYÚSCULAS. Decide tu lógica con este campo.
    - `reintentable`: `true` si repetir **la misma petición** más tarde puede funcionar (límite de
      peticiones, emisión en curso, SUNAT caída, error interno). `false` = hay que corregir algo antes.
    - Algunos errores agregan campos propios (`creditos_restantes`, `retry_after`, `campos`, o el
      estado del comprobante en `/reenviar`).

    | `codigo` | HTTP | `reintentable` | Significado |
    |---|---|---|---|
    | `NO_AUTENTICADO` | 401 | no | Falta la API key, es inválida o la cuenta está desactivada. |
    | `PLAN_VENCIDO` | 402 | no | El plan de la cuenta venció. Solo quedan abiertos `/ping`, `/account` y `/rucs*`. |
    | `SIN_CREDITOS` | 402 | no | Sin créditos. No se emitió ni envió nada. Trae `creditos_restantes: 0`. |
    | `RUC_NO_AUTORIZADO` | 403 | no | El RUC indicado no pertenece a la cuenta o no existe. |
    | `RUC_DESACTIVADO` | 403 | no | El RUC está desactivado (`PATCH /rucs/{ruc}/activation`). |
    | `LLAVE_DE_PRUEBA_EN_PRODUCCION` | 403 | no | Usaste la llave de prueba (`fs_test_…`) para emitir, anular, enviar una guía, reenviar, consultar-sunat o activar/desactivar un RUC que está en **producción**. Usa tu llave de producción. |
    | `SIN_PERMISO` | 403 | no | Acción no permitida. |
    | `NO_ENCONTRADO` | 404 | no | No existe el comprobante/guía/anulación, o el archivo a descargar (PDF/XML/CDR). |
    | `RUTA_NO_ENCONTRADA` | 404 | no | La URL no existe (revisa la ruta y la URL base). |
    | `METODO_NO_PERMITIDO` | 405 | no | Método HTTP incorrecto para esa ruta. |
    | `EMISION_EN_CURSO` | 409 | **sí** | Ya hay una emisión en curso con esa `Idempotency-Key`. Reintenta en unos segundos. |
    | `CONFLICTO` | 409 | no | Conflicto con el estado actual (ej. el RUC ya está registrado con otra cuenta). |
    | `DATOS_INVALIDOS` | 422 | no | El payload o los parámetros no pasan la validación. Si hay detalle por campo, viene en `campos`. |
    | `RUC_REQUERIDO` | 422 | no | La cuenta tiene varios RUCs y no indicaste cuál (`ruc`). |
    | `RUC_SIN_TENANT` | 422 | no | El RUC no tiene una empresa (tenant) asociada. Contacta soporte. |
    | `CERTIFICADO_NO_CONFIGURADO` | 422 | no | El RUC no tiene certificado digital (ni envío por PSE). |
    | `ERROR_EMISION` | 422 | no | El motor no pudo generar el comprobante/guía/anulación. Revisa `message`. Crédito devuelto. |
    | `RECHAZADO_SUNAT` | 422 | no | `/reenviar`: SUNAT rechazó el comprobante (estado `09`). Corrige y emite uno nuevo. |
    | `REENVIO_FALLIDO` | 422 | no | `/reenviar`: el reintento no se completó por otro motivo. Revisa `message`. |
    | `SUNAT_NO_DISPONIBLE` | 422 / 5xx | **sí** | SUNAT (o la red hacia SUNAT/PSE) no respondió. Reintenta más tarde. |
    | `LIMITE_PETICIONES` | 429 | **sí** | Demasiadas peticiones. Espera `Retry-After` segundos. |
    | `LIMITE_PRUEBAS_DIARIO` | 429 | **no** | Llegaste a las 200 operaciones en modo demo de hoy. Se reinicia a medianoche (hora de Perú). Trae `pruebas_restantes_hoy: 0`, `limite_pruebas_diario` y `creditos_restantes`. |
    | `ANULACION_MIXTA` | 422 | no | `POST /anulaciones` con facturas y boletas juntas. Haz una petición para cada tipo. |
    | `ERROR_INTERNO` | 5xx | **sí** | Error interno del servidor. Reintenta; si persiste, contacta soporte. |
    | `PDF_NO_GENERADO` | 500 | **sí** | `GET /documents/{external_id}/pdf?formato=…`: el generador de PDF falló dos veces seguidas. Reintenta en unos segundos. Nunca se entrega un PDF de otro tamaño. |
    | `LIMITE_ESTABLECIMIENTOS` | 403 | no | `POST /establecimientos`: el plan del RUC no permite más locales. Se amplía el plan desde el sistema. |
    | `CATALOGO_NO_DISPONIBLE` | 503 | **no** | El catálogo pedido todavía no está cargado en el servidor. Reintentar no lo arregla. |

    La lista puede crecer: trata un `codigo` desconocido como no reintentable salvo que
    `reintentable` diga lo contrario.

    ### Errores de validación

    - Los errores del payload de emisión (`/documents`, `/anulaciones`, `/guias`) devuelven
      `422` con `codigo: DATOS_INVALIDOS` y el detalle en `message`.
    - `POST /calcular`, `GET /catalogos/{nombre}` y `GET /catalogos/productos-sunat` devuelven `422 DATOS_INVALIDOS` con el detalle
      por campo en `campos` (ej. `{"items.0.cantidad": ["cantidad debe ser un número mayor que 0."]}`).
    - Los endpoints con validación por campo (`GET /documents`, `POST /rucs`, `PATCH /rucs/{ruc}/activation`)
      devuelven `422` con `codigo: DATOS_INVALIDOS` y el mapa `{"campo": ["mensaje"]}` en `campos`.
      Por compatibilidad con integraciones existentes, ese mismo mapa sigue apareciendo donde
      aparecía antes: en la raíz del JSON si envías `Accept: application/json`, o dentro de `message`
      si no lo envías. Usa `campos`, que es igual en ambos casos.
      Nunca se exponen rutas de archivos ni líneas de código del servidor.
    - La API **ignora en silencio** los campos con nombre mal escrito.

servers:
  - url: https://{servidor}.factusmart.pe/api/v1/issuer
    description: |
      Servidor de producción donde vive tu cuenta. La URL base exacta aparece en tu panel de
      integrador (pestaña Configuración, "URL base de la API"); se arma con el host del portal donde
      te registraste. Una API key solo es válida en su servidor.
    variables:
      servidor:
        default: s2
        enum: [s1, s2, s3, s4]
        description: Servidor de FactuSmart al que pertenece tu cuenta API.

security:
  - ApiKeyHeader: []
  - BearerApiKey: []

tags:
  - name: Utilidades
    description: Pruebas de conexión.
  - name: Cuenta
    description: Saldo de créditos, plan y series.
  - name: RUCs
    description: Alta, listado y activación/desactivación de los RUCs de la cuenta.
  - name: Anexos
    description: Locales (establecimientos / anexos SUNAT) de un RUC, cada uno con sus series. No consumen crédito.
  - name: Comprobantes
    description: Facturas (01), boletas (03), notas de crédito (07) y débito (08).
  - name: Anulaciones
    description: Anulación de facturas (comunicación de baja) y boletas (resumen diario). Asíncrona, con ticket.
  - name: Guías de remisión
    description: Guías de remisión electrónica GRE 2.0 (asíncronas).
  - name: Herramientas
    description: Calcular importes y consultar catálogos SUNAT. No emiten nada ni consumen crédito.
  - name: Webhooks
    description: Avisos que FactuSmart envía a tu servidor cuando cambia el estado de un comprobante.

paths:
  /ping:
    get:
      operationId: ping
      tags: [Utilidades]
      summary: Probar la API key
      description: |
        Confirma que la API key es válida y devuelve el saldo. No consume crédito.
        Si se resolvió un RUC (indicado o único en la cuenta) agrega `ruc_emisor` y `razon_social`.
        `tipo_llave` indica si autenticaste con la llave de `prueba` (`fs_test_…`) o la de `produccion`.
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                success: true
                message: Autenticado correctamente
                cuenta: Mi Integración
                creditos: 4830
                tipo_llave: produccion
                ruc_emisor: "20123456789"
                razon_social: MI EMPRESA
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          $ref: '#/components/responses/RucWithoutTenant'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /account:
    get:
      operationId: getAccount
      tags: [Cuenta]
      summary: Estado de la cuenta
      description: Saldo disponible, total recargado, consumido, plan y RUCs de la cuenta. No requiere RUC. No consume crédito.
      responses:
        '200':
          description: Estado de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          $ref: '#/components/responses/RucWithoutTenant'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /series:
    get:
      operationId: listSeries
      tags: [Cuenta]
      summary: Series del RUC
      description: |
        Series configuradas en el establecimiento principal del RUC (el del usuario admin), con el
        siguiente número estimado. FactuSmart no usa F001/B001: cada RUC nace con series propias
        (FA01, BA01, FN01, TA01, ...). `siguiente_numero` es el último número emitido en esa serie + 1,
        contado sobre lo que corresponde a cada tipo (comprobantes 01/03/07/08, guías 09/31, etc.).
        Es una estimación: si otro proceso emite entre la consulta y tu envío, el número real será
        mayor (usa `numero_documento: "#"` para que el sistema asigne el correlativo). Requiere RUC.
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Series del RUC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
              example:
                success: true
                series:
                  - { serie: FA01, codigo_tipo_documento: "01", siguiente_numero: 15 }
                  - { serie: BA01, codigo_tipo_documento: "03", siguiente_numero: 230 }
                  - { serie: FN01, codigo_tipo_documento: "07", siguiente_numero: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents:
    post:
      operationId: emitDocument
      tags: [Comprobantes]
      summary: Emitir comprobante
      description: |
        Emite una factura (01), boleta (03), nota de crédito (07) o nota de débito (08): genera el XML
        UBL 2.1, lo firma, crea el PDF, lo envía a SUNAT y responde con el resultado. Cuesta 1 crédito
        (gratis en RUCs demo, con tope de 200 pruebas por día; ver "Pruebas sin costo").

        - **Lo más fácil:** arma `items` y `totales` con `POST /calcular` y cópialos tal cual aquí.

        - `serie_documento` es opcional si el establecimiento tiene una sola serie para ese tipo
          (caso normal en facturas y boletas). En notas normalmente hay dos (de factura y de boleta):
          envíala. Consulta `GET /series`.
        - `numero_documento`: envía `"#"` (o no lo envíes) para que FactuSmart asigne el correlativo.
          Si mandas un número que ya existe → `422`.
        - Cliente con RUC (`6`) o DNI (`1`): basta el número; nombre y dirección se autocompletan.
          Otros tipos exigen `apellidos_y_nombres_o_razon_social`.
        - Factura con `codigo_tipo_operacion` `0101` exige cliente con RUC. Boleta mayor a S/ 700
          exige cliente identificado.
        - Si hay `detraccion`, la leyenda 2006 se agrega sola. Con operación `1004`,
          `ubigeo_origen` y `ubigeo_destino` son obligatorios.
        - HTTP `200` = comprobante generado. Revisa `aceptado_por_sunat`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitDocumentRequest'
            examples:
              facturaMinima:
