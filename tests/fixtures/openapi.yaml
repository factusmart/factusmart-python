          description: Datos del comprobante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/{type}:
    get:
      operationId: downloadDocumentFile
      tags: [Comprobantes]
      summary: Descargar PDF, XML o CDR
      description: |
        Descarga el PDF (formato A4, se regenera en cada descarga), el XML firmado o el CDR (ZIP de
        SUNAT) del comprobante. No consume crédito. El PDF y el XML existen desde que el comprobante
        se genera (incluso en estado `01`); el CDR solo cuando SUNAT respondió.
        Si el comprobante o el archivo (PDF, XML o CDR) no existen, responde `404` JSON con
        `codigo: NO_ENCONTRADO` (si falta el CDR, consulta a SUNAT con `/consultar-sunat` y reintenta).

        Si tu cuenta tiene varios RUC, indica el emisor con `?ruc=20123456789` (o el header `X-RUC`);
        sin él responde `422 RUC_REQUERIDO`. Basta el header `X-API-Key`: no hace falta un header
        `Accept` especial (la respuesta trae el `Content-Type` del archivo; los errores siempre en JSON).

        **PDF en ticket u otro tamaño:** `GET /documents/{external_id}/pdf?formato=ticket`.

        | `formato` | Tamaño | Ancho de página |
        |---|---|---|
        | *(sin formato)* | A4, igual que siempre | 210 mm |
        | `a4` | A4 | 210 mm |
        | `a5` | A5 apaisado | 210 × 148 mm |
        | `ticket` o `ticket80` | Ticket de 80 mm | 78 mm |
        | `ticket58` | Ticket de 58 mm | 56 mm |
        | `ticket50` | Ticket de 50 mm | 45 mm |

        - Es el mismo PDF que imprime el sistema web con el botón "Imprimir" en ese tamaño (mismo
          diseño y logo del RUC). Funciona en cualquier estado, también en `01`.
        - Pedir otro formato **no cambia** el PDF que recibe tu cliente final (correo, consulta
          pública) ni el que descargas sin `formato`: ese sigue siendo el A4.
        - Solo aplica al PDF: `/xml?formato=…` o `/cdr?formato=…` → `422 DATOS_INVALIDOS`. Un formato
          inválido también → `422`, con la lista en `formatos_validos`.
        - Si el generador falla dos veces seguidas → `500 PDF_NO_GENERADO` (reintentable). Nunca se
          entrega un PDF de otro tamaño "disfrazado".
        - `GET /documents/{external_id}` trae también `links.pdf_ticket` (el de 80 mm).
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - name: type
          in: path
          required: true
          description: Archivo a descargar.
          schema:
            type: string
            enum: [pdf, xml, cdr]
        - name: formato
          in: query
          required: false
          description: |
            Solo para `pdf`. Tamaño del PDF. Sin él, el A4 de siempre. `ticket` y `ticket80` son el
            mismo (80 mm).
          schema:
            type: string
            enum: [a4, a5, ticket, ticket80, ticket58, ticket50]
          example: ticket
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: El archivo, como adjunto.
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            application/xml:
              schema: { type: string }
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: Comprobante no encontrado, o PDF/XML/CDR inexistente en el servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                comprobante:
                  value: { success: false, message: 'Comprobante no encontrado.', codigo: NO_ENCONTRADO, reintentable: false }
                cdr:
                  value: { success: false, message: 'El CDR de este comprobante no está disponible todavía. Consulta a SUNAT con POST /documents/{external_id}/consultar-sunat y vuelve a intentar.', codigo: NO_ENCONTRADO, reintentable: false }
        '422':
          description: Falta el RUC, `formato` inválido, o `formato` en `xml`/`cdr`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                rucRequerido:
                  value: { success: false, message: 'Indica el RUC emisor en el campo "ruc".', codigo: RUC_REQUERIDO, reintentable: false }
                formatoInvalido:
                  summary: Formato de PDF inválido
                  value:
                    success: false
                    message: 'Formato de PDF inválido: "carta". Válidos: a4, a5, ticket, ticket80, ticket58, ticket50.'
                    codigo: DATOS_INVALIDOS
                    reintentable: false
                    campos: { formato: ['Debe ser uno de: a4, a5, ticket, ticket80, ticket58, ticket50.'] }
                    formatos_validos: [a4, a5, ticket, ticket80, ticket58, ticket50]
                formatoNoPdf:
                  summary: formato en xml o cdr
                  value:
                    success: false
                    message: 'El parámetro "formato" solo aplica al PDF (GET /documents/{external_id}/pdf).'
                    codigo: DATOS_INVALIDOS
                    reintentable: false
                    campos: { formato: ['Solo aplica al PDF.'] }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Error interno, o el PDF en el `formato` pedido no se pudo generar (`PDF_NO_GENERADO`, reintentable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pdfNoGenerado:
                  value: { success: false, message: 'No se pudo generar el PDF en formato ticket58. Vuelve a intentar en unos segundos.', codigo: PDF_NO_GENERADO, reintentable: true }
                interno:
                  value: { success: false, message: 'Ocurrió un error interno. Intenta de nuevo en unos segundos.', codigo: ERROR_INTERNO, reintentable: true }

  /documents/{external_id}/reenviar:
    post:
      operationId: resendDocument
      tags: [Comprobantes]
      summary: Reenviar a SUNAT
      description: |
        Reintenta el envío del mismo comprobante (sin crear uno nuevo ni gastar correlativo). Pensado para
        estados `01` y `09`. No consume crédito. `success: true` significa que el reintento se ejecutó;
        revisa `aceptado_por_sunat`. Si el reintento falla responde `422` **con el mismo cuerpo**
        (`success: false`, `mensaje`, `estado`...) más los campos de error comunes `message`, `codigo`
        (`RECHAZADO_SUNAT`, `SUNAT_NO_DISPONIBLE` o `REENVIO_FALLIDO`) y `reintentable`.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RucOnlyBody'
            example: { ruc: "20123456789" }
      responses:
        '200':
          description: Reintento ejecutado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbiddenOrTestKey'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          description: Falta el RUC (formato `Error`) o el reintento falló (formato `ResendResponse` con `success:false`, más `message`, `codigo` y `reintentable`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ResendResponse'
                  - $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/consultar-sunat:
    post:
      operationId: querySunatStatus
      tags: [Comprobantes]
      summary: Consultar estado real en SUNAT
      description: |
        Pregunta a SUNAT en vivo por el comprobante (consulta de CDR), sincroniza el estado y lo devuelve.
        Útil cuando el envío quedó en el aire. No consume crédito.

        **Solo funciona con RUC en producción.** SUNAT no ofrece este servicio de consulta en su
        entorno de pruebas (beta): con un RUC en modo prueba la respuesta es `422` con
        "No se pudo consultar a SUNAT: ... Unauthorized". En pruebas usa `POST /documents/{external_id}/reenviar`.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RucOnlyBody'
            example: { ruc: "20123456789" }
      responses:
        '200':
          description: Consulta realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuerySunatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbiddenOrTestKey'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          description: 'Falta el RUC o la consulta a SUNAT falló (`No se pudo consultar a SUNAT: ...`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

