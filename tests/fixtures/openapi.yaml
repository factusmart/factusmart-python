                      total_igv: 36.00
                      total_impuestos: 36.00
                      total_valor_item: 200.00
                      total_item: 236.00
      responses:
        '200':
          description: |
            Comprobante generado (o respuesta repetida por `Idempotency-Key`). No implica aceptación de
            SUNAT: revisa `aceptado_por_sunat`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmitDocumentResponse'
              example:
                success: true
                estado: "05"
                estado_descripcion: Aceptado
                serie_numero: FA01-1234
                external_id: 9822f52c-108e-47ff-9d2e-5f0c3c1a7b11
                sunat: { codigo: "0", descripcion: "La Factura numero FA01-1234, ha sido aceptada" }
                creditos_restantes: 4830
                aceptado_por_sunat: true
                entorno: prueba
                tiene_validez_fiscal: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/NoCredits'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '409':
          description: Ya hay una emisión en curso con esa `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: Ya hay una emisión en curso con esa Idempotency-Key. Reintenta en unos segundos.
        '422':
          description: |
            Falta el RUC (cuenta con varios), el RUC no tiene tenant, payload inválido
            (`Datos del comprobante inválidos o incompletos...`) o error del motor de emisión
            (`Ocurrió un error al emitir el comprobante: ...`). El crédito no se cobra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                payloadInvalido:
                  value:
                    success: false
                    message: "Datos del comprobante inválidos o incompletos. Revisa el formato del JSON. (La serie ingresada FA09, es incorrecta.)"
                rucRequerido:
                  value:
                    success: false
                    message: Indica el RUC emisor en el campo "ruc" (tu cuenta tiene varios RUCs enlazados).
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

    get:
      operationId: listDocuments
      tags: [Comprobantes]
      summary: Listar comprobantes
      description: |
        Lista comprobantes (01/03/07/08) del RUC, del más reciente al más antiguo, con el diagnóstico
        SUNAT de cada uno. Paginación por cursor: pasa `siguiente_cursor` como `antes_de`.
        No consume crédito.
      parameters:
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
        - name: estado
          in: query
          required: false
          description: Filtra por código de estado (ej. `01` para los no aceptados todavía).
          schema:
            $ref: '#/components/schemas/EstadoCodigo'
        - name: desde
          in: query
          required: false
          description: Fecha de emisión mínima (inclusive).
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: false
          description: Fecha de emisión máxima (inclusive).
          schema: { type: string, format: date }
        - name: limite
          in: query
          required: false
          description: Cantidad máxima de resultados.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: antes_de
          in: query
          required: false
          description: Cursor. Devuelve comprobantes con id interno menor a este valor.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Página de comprobantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          description: Falta el RUC o los filtros no pasan la validación.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationErrorMap'
                  - $ref: '#/components/schemas/ErrorWithDebug'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}:
    get:
      operationId: getDocument
      tags: [Comprobantes]
      summary: Consultar un comprobante
      description: |
        Estado guardado del comprobante (no consulta a SUNAT en vivo; para eso usa
        `POST /documents/{external_id}/consultar-sunat`). Incluye links de descarga. No consume crédito.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Datos del comprobante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/{type}:
    get:
      operationId: downloadDocumentFile
      tags: [Comprobantes]
      summary: Descargar PDF, XML o CDR
      description: |
        Descarga el PDF (formato A4, se regenera en cada descarga), el XML firmado o el CDR (ZIP de
        SUNAT) del comprobante. No consume crédito. El PDF y el XML existen desde que el comprobante
        se genera (incluso en estado `01`); el CDR solo cuando SUNAT respondió.
        Si el comprobante, el PDF o el CDR no existen, responde **404 con una página HTML** (no JSON).
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - name: type
          in: path
          required: true
          description: Archivo a descargar.
          schema:
            type: string
            enum: [pdf, xml, cdr]
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: El archivo, como adjunto.
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            application/xml:
              schema: { type: string }
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: Comprobante no encontrado, o PDF/CDR inexistente en el servidor. Página HTML explicativa.
          content:
            text/html:
              schema: { type: string }
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/reenviar:
    post:
      operationId: resendDocument
      tags: [Comprobantes]
      summary: Reenviar a SUNAT
      description: |
        Reintenta el envío del mismo comprobante (sin crear uno nuevo ni gastar correlativo). Pensado para
        estados `01` y `09`. No consume crédito. `success: true` significa que el reintento se ejecutó;
        revisa `aceptado_por_sunat`. Si el reintento falla responde `422` **con el mismo cuerpo**
        (`success: false`, `mensaje`, `estado`...), no con el formato de error genérico.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RucOnlyBody'
            example: { ruc: "20123456789" }
      responses:
        '200':
          description: Reintento ejecutado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          description: Falta el RUC (formato `Error`) o el reintento falló (formato `ResendResponse` con `success:false`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ResendResponse'
                  - $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/consultar-sunat:
    post:
      operationId: querySunatStatus
      tags: [Comprobantes]
      summary: Consultar estado real en SUNAT
      description: |
        Pregunta a SUNAT en vivo por el comprobante (consulta de CDR), sincroniza el estado y lo devuelve.
        Útil cuando el envío quedó en el aire. No consume crédito.

        **Solo funciona con RUC en producción.** SUNAT no ofrece este servicio de consulta en su
        entorno de pruebas (beta): con un RUC en modo prueba la respuesta es `422` con
        "No se pudo consultar a SUNAT: ... Unauthorized". En pruebas usa `POST /documents/{external_id}/reenviar`.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RucOnlyBody'
            example: { ruc: "20123456789" }
      responses:
        '200':
          description: Consulta realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuerySunatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          description: 'Falta el RUC o la consulta a SUNAT falló (`No se pudo consultar a SUNAT: ...`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /documents/{external_id}/historial:
    get:
      operationId: getDocumentHistory
      tags: [Comprobantes]
      summary: Historial del comprobante
      description: Línea de tiempo del comprobante (creación, cambios de estado, respuestas de SUNAT, reintentos, errores). No consume crédito.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Historial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '422':
          $ref: '#/components/responses/RucRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /anulaciones:
    post:
      operationId: voidDocument
      tags: [Anulaciones]
      summary: Anular comprobantes (comunicación de baja)
      description: |
        Envía una comunicación de baja a SUNAT y devuelve un `ticket` para consultar el resultado.
        Cuesta 1 crédito (se devuelve si el envío falla).

        - `fecha_de_emision_de_documentos` en formato **DD-MM-AAAA** y debe ser **exactamente** la
          fecha de emisión de cada comprobante listado (todos deben compartirla).
        - Solo acepta comprobantes del grupo factura (facturas y sus notas). Las boletas no se anulan por
          este endpoint (SUNAT las anula vía resumen diario, que esta API no expone).
        - Requiere certificado digital configurado en el RUC (o envío por PSE).
      parameters:
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
            example:
              ruc: "20123456789"
              fecha_de_emision_de_documentos: "08-07-2026"
              documentos:
                - external_id: 9822f52c-108e-47ff-9d2e-5f0c3c1a7b11
                  motivo_anulacion: Error en el comprobante
      responses:
        '200':
          description: Comunicación de baja enviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/NoCredits'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          description: |
            Falta el RUC, payload inválido (p. ej. `El código externo ... no fue encontrado o la fecha
            indica no corresponde al documento.`), certificado no encontrado, o error al generar/enviar
            la baja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /anulaciones/{ticket}/status:
    get:
      operationId: getVoidStatus
      tags: [Anulaciones]
      summary: Estado de una anulación
      description: Consulta a SUNAT el resultado de la comunicación de baja asociada al ticket. No consume crédito.
      parameters:
        - name: ticket
          in: path
          required: true
          description: Ticket devuelto por `POST /anulaciones`.
          schema: { type: string }
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Resultado de la consulta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: No existe una anulación con ese ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Anulación no encontrada para ese ticket.' }
        '422':
          description: Falta el RUC o la consulta a SUNAT falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /guias:
    post:
      operationId: emitDispatchGuide
      tags: [Guías de remisión]
      summary: Emitir guía de remisión (GRE 2.0)
      description: |
        Genera, firma y crea el PDF de la guía; luego la envía a SUNAT (proceso asíncrono). Cuesta
        1 crédito solo si el envío a SUNAT tiene éxito; si no se pudo enviar, la guía queda creada,
        `enviado` es `false` y el crédito se devuelve (respuesta `200`).

        - Requiere certificado digital y credenciales GRE de SUNAT configurados en el RUC.
        - Envía siempre `serie_documento` (ej. `TA01` remitente, `VA01` transportista).
        - El establecimiento se indica con `datos_del_emisor.codigo_del_domicilio_fiscal` (no con
          `codigo_establecimiento`).
        - Para `09` (remitente) el bloque `datos_del_cliente_o_receptor` es obligatorio.
        - No usa `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/XRucHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchGuideRequest'
            examples:
              remitenteTransportePrivado:
                summary: Guía del remitente, transporte privado
                value:
                  ruc: "20123456789"
                  serie_documento: TA01
                  numero_documento: "#"
                  fecha_de_emision: "2026-07-08"
                  hora_de_emision: "10:30:00"
                  codigo_tipo_documento: "09"
                  datos_del_emisor: { codigo_del_domicilio_fiscal: "0000" }
                  datos_del_cliente_o_receptor:
                    codigo_tipo_documento_identidad: "6"
                    numero_documento: "20555555555"
                    apellidos_y_nombres_o_razon_social: EMPRESA DESTINO S.A.C.
                  codigo_motivo_traslado: "01"
                  descripcion_motivo_traslado: Venta
                  fecha_de_traslado: "2026-07-08"
                  peso_total: 50
                  unidad_peso_total: KGM
                  numero_de_bultos: 2
                  codigo_modo_transporte: "02"
                  direccion_partida:
                    ubigeo: "150101"
                    direccion: Av. Partida 123 - Lima
                    codigo_del_domicilio_fiscal: "0000"
                  direccion_llegada:
                    ubigeo: "150203"
                    direccion: Av. Llegada 456 - Barranca
                    codigo_del_domicilio_fiscal: "-"
                  vehiculo: { numero_de_placa: ABC123 }
                  chofer:
                    codigo_tipo_documento_identidad: "1"
                    numero_documento: "12345678"
                    nombres: Juan Pérez
                    numero_licencia: Q12345678
                  items:
                    - codigo_interno: PROD-001
                      descripcion: Producto trasladado
                      unidad_de_medida: NIU
                      cantidad: 10
      responses:
        '200':
          description: Guía creada (revisa `enviado`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/NoCredits'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '422':
          description: Falta el RUC, payload inválido, certificado no encontrado o error al generar la guía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /guias/{external_id}/status:
    get:
      operationId: getDispatchGuideStatus
      tags: [Guías de remisión]
      summary: Estado de una guía
      description: Consulta a SUNAT el ticket de envío de la guía y devuelve su estado. No consume crédito.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/RucQuery'
        - $ref: '#/components/parameters/XRucHeader'
      responses:
        '200':
          description: Estado de la guía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RucForbidden'
        '404':
          description: Guía no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Guía no encontrada.' }
        '422':
          description: Falta el RUC o la consulta a SUNAT falló.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

  /rucs:
    get:
      operationId: listRucs
      tags: [RUCs]
      summary: Listar RUCs de la cuenta
      description: RUCs enlazados a la cuenta con su entorno (`demo`/`produccion`) y si están activos. No consume crédito.
      responses:
        '200':
          description: Lista de RUCs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RucListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'
    post:
      operationId: createRuc
      tags: [RUCs]
      summary: Crear un RUC
      description: |
        Da de alta un RUC nuevo enlazado a la cuenta (nace en modo prueba/demo). Idempotente: si el RUC
        ya pertenece a esta cuenta devuelve `200` con `ya_existia: true`. Si pertenece a otra cuenta →
        `409`. Tope de autoservicio por cuenta (por defecto 50 RUCs) → `422`. No consume crédito.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRucRequest'
            example:
              ruc: "20609999991"
              empresa: Mi Cliente SAC
              correo: contacto@micliente.pe
              clave: una-clave-de-al-menos-6-caracteres
      responses:
        '200':
          description: El RUC ya existía en esta cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRucResponse'
        '201':
          description: RUC creado en modo demo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRucResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El RUC ya está registrado con otra cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Ese RUC ya está registrado en el sistema (con otra cuenta).' }
        '422':
          description: Validación fallida, tope de RUCs alcanzado o error al crear el tenant.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ValidationErrorMap'
                  - $ref: '#/components/schemas/ErrorWithDebug'
        '500':
          description: Plan de integradores no configurado en el servidor, límite de peticiones o error interno.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorWithDebug'

  /rucs/{ruc}/activation:
    patch:
      operationId: setRucActivation
      tags: [RUCs]
      summary: Activar o desactivar un RUC
      description: |
        Desactiva (`activo: false`) o reactiva (`activo: true`) un RUC de la cuenta. Un RUC desactivado
        no puede emitir, consultar ni descargar nada por la API ni por su panel. Reversible; no borra
        datos. No existe endpoint para eliminar un RUC.
      parameters:
        - name: ruc
          in: path
          required: true
          description: RUC de 11 dígitos enlazado a la cuenta.
          schema: { type: string, pattern: '^\d{11}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RucActivationRequest'
            example: { activo: false }
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RucActivationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: El RUC no pertenece a la cuenta o no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { success: false, message: 'Ese RUC no pertenece a esta cuenta o no existe.' }
        '422':
          $ref: '#/components/responses/LaravelValidation'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerErrorOrRateLimit'

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key de la cuenta (panel de integrador, pestaña Configuración).
    BearerApiKey:
      type: http
      scheme: bearer
      description: Alternativa aceptada por el middleware, `Authorization Bearer` con la misma API key. Solo se usa si no hay `X-API-Key`.

  parameters:
    RucQuery:
      name: ruc
      in: query
      required: false
      description: RUC emisor (11 dígitos). Obligatorio si la cuenta tiene varios RUCs. También se acepta `emisor_ruc`.
      schema: { type: string, pattern: '^\d{11}$' }
    XRucHeader:
      name: X-RUC
      in: header
      required: false
      description: Alternativa al campo `ruc` (se usa solo si `ruc` y `emisor_ruc` no vienen).
      schema: { type: string, pattern: '^\d{11}$' }
    ExternalId:
      name: external_id
      in: path
      required: true
      description: Identificador (UUID) devuelto al emitir.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Valor único por venta (ej. el id de la venta en tu sistema). Ver sección Idempotencia.
      schema: { type: string }

  responses:
    Unauthorized:
      description: API key ausente, inválida o cuenta desactivada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinKey:
              value: { success: false, message: 'API key requerida. Envíala en el header X-API-Key.' }
            invalida:
              value: { success: false, message: 'API key inválida o cuenta desactivada.' }
    RucForbidden:
      description: El RUC indicado no pertenece a la cuenta, o el RUC está desactivado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ajeno:
              value: { success: false, message: 'El RUC indicado no pertenece a esta cuenta o no existe.' }
            desactivado:
              value: { success: false, message: "Este RUC está desactivado. Reactívalo con PATCH /rucs/{ruc}/activation antes de continuar." }
    RucWithoutTenant:
      description: El RUC resuelto no tiene tenant asociado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'El RUC no tiene un tenant asociado.' }
    RucRequired:
      description: No se pudo determinar el RUC emisor (cuenta con varios RUCs y no se indicó), o el RUC no tiene tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'Indica el RUC emisor en el campo "ruc".' }
    DocumentNotFound:
      description: No existe un comprobante con ese `external_id` en el RUC.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { success: false, message: 'Comprobante no encontrado.' }
    NoCredits:
      description: Sin créditos disponibles. No se emitió ni envió nada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoCreditsError'
          example:
            success: false
            message: Sin créditos disponibles en la cuenta. Recargue para seguir emitiendo.
            creditos_restantes: 0
    LaravelValidation:
      description: |
        Validación fallida. Con `Accept: application/json` el cuerpo es el mapa crudo de errores; sin ese
        header, un objeto `ErrorWithDebug` con el mapa dentro de `message`.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationErrorMap'
              - $ref: '#/components/schemas/ErrorWithDebug'
          example: { activo: [El campo activo es obligatorio.] }
    RateLimited:
      description: |
        Límite de peticiones superado (120/min por API key, 60/min por IP). Espera los segundos
        indicados en `Retry-After` (o `retry_after`) y reintenta.
      headers:
        Retry-After:
          description: Segundos a esperar antes de reintentar.
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string }
              retry_after: { type: integer }
          example:
            success: false
            message: Demasiadas peticiones. Espera 40 segundos e intenta de nuevo.
            retry_after: 40
    ServerErrorOrRateLimit:
      description: |
        Error interno del servidor. Los errores técnicos (SQL, PHP) se devuelven sin `file`/`line`.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ErrorWithDebug'
              - $ref: '#/components/schemas/Error'
          example:
            success: false
            message: Error interno del servidor.

  schemas:
    # ───────────── Errores ─────────────
    Error:
      type: object
      description: Forma de error usada por los controladores y el middleware de la API.
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string, description: 'Mensaje legible en español.' }
    NoCreditsError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [creditos_restantes]
          properties:
            creditos_restantes: { type: integer, const: 0 }
    ErrorWithDebug:
      type: object
      description: Forma generada por el manejador global de excepciones de Laravel (incluye ruta y línea del archivo).
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message:
          description: Texto, o mapa de errores de validación.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ValidationErrorMap'
        file: { type: string }
        line: { type: integer }
    ValidationErrorMap:
      type: object
      description: 'Mapa campo → lista de mensajes (Laravel). Ejemplo: `{"limite": ["El campo limite no debe ser mayor que 100."]}`.'
      additionalProperties:
        type: array
        items: { type: string }

    # ───────────── Catálogos ─────────────
    EstadoCodigo:
      type: string
      description: 'Estado del comprobante: 01 Registrado, 03 Enviado, 05 Aceptado, 07 Observado, 09 Rechazado, 11 Anulado, 13 Por anular.'
      enum: ["01", "03", "05", "07", "09", "11", "13"]
    TipoDocumentoComprobante:
      type: string
      description: 01 Factura, 03 Boleta de venta, 07 Nota de crédito, 08 Nota de débito.
      enum: ["01", "03", "07", "08"]
    Moneda:
      type: string
      description: Código de moneda (catálogo del RUC; se crea con PEN y USD).
      enum: [PEN, USD]
    AfectacionIgv:
      type: string
      description: |
        Catálogo 07 SUNAT. 10 Gravado onerosa; 11-16 Gravado retiro/bonificación (gratuitas);
        17 IVAP; 20 Exonerado onerosa; 21 Exonerado gratuita; 30 Inafecto onerosa; 31-37 Inafecto
        retiro/gratuita; 40 Exportación.
      enum: ["10", "11", "12", "13", "14", "15", "16", "17", "20", "21", "30", "31", "32", "33", "34", "35", "36", "37", "40"]
    TipoDocumentoIdentidad:
      type: string
      description: 'Catálogo 06 SUNAT: 0 Doc. trib. no domiciliado sin RUC, 1 DNI, 4 Carnet de extranjería, 6 RUC, 7 Pasaporte, A-E otros.'
      enum: ["0", "1", "4", "6", "7", "A", "B", "C", "D", "E"]

    # ───────────── Feedback SUNAT (común) ─────────────
    SunatFeedback:
      type: object
      description: Diagnóstico SUNAT que se agrega a las respuestas de comprobantes.
      required: [aceptado_por_sunat, entorno, tiene_validez_fiscal]
      properties:
        sunat:
          description: Código y mensaje de SUNAT guardados para el comprobante (solo si existen).
          type: object
          properties:
            codigo: { type: [string, "null"] }
            descripcion: { type: [string, "null"] }
        aceptado_por_sunat:
          type: boolean
          description: true solo si `estado` es `05`.
        entorno:
          type: string
          enum: [prueba, produccion]
          description: Entorno en el que se emitió ESTE comprobante.
        tiene_validez_fiscal:
          type: boolean
        accion_requerida:
          type: string
          description: Solo en estados `01` y `09`; qué hacer a continuación.

    # ───────────── Utilidades / Cuenta ─────────────
    PingResponse:
      type: object
      required: [success, message, cuenta, creditos]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        cuenta: { type: [string, "null"], description: 'Nombre de la cuenta API.' }
        creditos: { type: integer, description: 'Créditos disponibles (cupo del plan + bolsa).' }
        ruc_emisor: { type: [string, "null"], description: 'Solo si se resolvió un RUC.' }
        razon_social: { type: [string, "null"], description: 'Solo si se resolvió un RUC. Es el nombre comercial (`trade_name`) de la empresa.' }
    AccountResponse:
      type: object
      required: [success, cuenta, creditos_disponibles, creditos_recargados_total, creditos_consumidos, plan, rucs]
      properties:
        success: { type: boolean, const: true }
        cuenta: { type: string }
        creditos_disponibles: { type: integer, description: 'Lo que puede emitir ahora (cupo del plan restante este mes + bolsa).' }
        creditos_recargados_total: { type: integer }
        creditos_consumidos: { type: integer }
        plan:
          $ref: '#/components/schemas/PlanSummary'
        rucs:
          type: array
          items:
            type: object
            properties:
              ruc: { type: string }
              nombre: { type: string }
      example:
        success: true
        cuenta: Mi Integración
        creditos_disponibles: 4830
        creditos_recargados_total: 5000
        creditos_consumidos: 170
        plan:
          plan: Pro
          plan_activo: true
          plan_vencido: false
          periodo: mensual
          plan_vence: "2026-10-31"
          cupo_mensual: 1000
          cupo_usado_mes: 120
          cupo_restante_mes: 880
          cupo_se_renueva: "2026-10-15"
          bolsa: 3950
          bolsa_vence: { fecha: "2027-07-08", cantidad: 3950 }
          disponibles: 4830
        rucs:
          - { ruc: "20123456789", nombre: MI EMPRESA S.A.C. }
    PlanSummary:
      type: object
      properties:
        plan: { type: [string, "null"], description: 'Nombre del plan de suscripción, o null.' }
        plan_activo: { type: boolean }
        plan_vencido: { type: boolean, description: 'true si la cuenta tuvo plan y ya venció (no se renovó).' }
        periodo: { type: [string, "null"], enum: [mensual, anual, null] }
        plan_vence: { type: [string, "null"], format: date }
        cupo_mensual: { type: integer }
        cupo_usado_mes: { type: integer }
        cupo_restante_mes: { type: integer }
        cupo_se_renueva: { type: [string, "null"], format: date }
        bolsa: { type: integer, description: 'Créditos de recargas sueltas.' }
        bolsa_vence:
          type: [object, "null"]
          description: Próximo vencimiento de la bolsa.
          properties:
            fecha: { type: string, format: date }
            cantidad: { type: integer }
        disponibles: { type: integer }
    SeriesResponse:
      type: object
      required: [success, series]
      properties:
        success: { type: boolean, const: true }
        series:
          type: array
          items:
            type: object
            properties:
              serie: { type: string, examples: [FA01] }
              codigo_tipo_documento: { type: string, description: 'Tipo de comprobante de la serie (01, 03, 07, 08, 09, 31...).' }
              siguiente_numero: { type: integer }

    # ───────────── Emisión de comprobantes ─────────────
    EmitDocumentRequest:
      type: object
      description: Comprobante (factura, boleta, nota de crédito o débito). Los campos desconocidos se ignoran.
      required:
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - codigo_tipo_moneda
        - datos_del_cliente_o_receptor
        - totales
        - items
      additionalProperties: true
      properties:
        ruc:
          type: string
          pattern: '^\d{11}$'
          description: RUC emisor. Obligatorio si la cuenta tiene varios RUCs.
        codigo_establecimiento:
          type: string
          description: Código del local desde el que se emite (ej. `0001`). Por defecto, el establecimiento del admin (`0000`).
        serie_documento:
          type: string
          description: Serie (ej. FA01, BA01, FN01). Opcional si el establecimiento tiene una sola serie para el tipo.
        numero_documento:
          type: string
          default: "#"
          description: '`#` para correlativo automático. Un número explícito ya usado da `422`.'
        fecha_de_emision:
          type: string
          format: date
          description: Fecha de emisión (YYYY-MM-DD). Debe ser la fecha real (hoy, hora de Perú).
        hora_de_emision:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: Hora de emisión (HH:MM:SS).
        fecha_de_vencimiento:
          type: string
          format: date
          description: Solo facturas/boletas. Si no se envía, se usa la fecha de emisión.
        codigo_tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoComprobante'
        codigo_tipo_operacion:
          type: string
          description: Catálogo 51 SUNAT (0101 venta interna, 0200 exportación, 1001 detracción, 1004 detracción transporte de carga...). Obligatorio en la práctica para 01/03; no aplica a notas.
          examples: ["0101"]
        codigo_tipo_moneda:
          $ref: '#/components/schemas/Moneda'
        factor_tipo_de_cambio:
          type: number
          default: 1
          description: Tipo de cambio de venta.
        numero_orden_de_compra:
          type: string
          description: Referencia de orden de compra (aparece en PDF y XML).
        numero_de_placa:
          type: string
          description: Placa vehicular (ventas de combustible, etc.).
        informacion_adicional:
          type: string
          description: Texto libre que aparece en el PDF y viaja en el XML como nota adicional.
        codigo_condicion_de_pago:
          type: string
          enum: ["01", "02"]
          default: "01"
          description: '`01` Contado, `02` Crédito (requiere `cuotas`). Un texto como "Credito" se ignora y se emite al contado.'
        cuotas:
          type: array
          description: Cuotas del crédito. La suma debe coincidir con `total_venta`.
          items:
            $ref: '#/components/schemas/Cuota'
        pagos:
          type: array
          description: Pagos recibidos (solo 01/03).
          items:
            $ref: '#/components/schemas/Pago'
        datos_del_cliente_o_receptor:
          $ref: '#/components/schemas/Cliente'
        totales:
          $ref: '#/components/schemas/Totales'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemComprobante'
        detraccion:
          $ref: '#/components/schemas/Detraccion'
        percepcion:
          $ref: '#/components/schemas/ImpuestoAdicional'
        retencion:
          $ref: '#/components/schemas/ImpuestoAdicional'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        descuentos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        anticipos:
          type: array
          items:
            $ref: '#/components/schemas/Anticipo'
        guias:
          type: array
          description: Guías de remisión relacionadas.
          items:
            $ref: '#/components/schemas/DocumentoReferencia'
        relacionados:
          type: array
          description: Otros documentos relacionados.
          items:
            allOf:
              - $ref: '#/components/schemas/DocumentoReferencia'
              - type: object
                required: [monto]
                properties:
                  monto: { type: number }
        leyendas:
          type: array
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'
        codigo_tipo_nota:
          type: string
          description: 'Obligatorio en 07/08. Crédito (cat. 09): 01 Anulación de la operación, 07 Devolución por ítem, etc.; débito (cat. 10): 01 Intereses por mora, 02 Aumento en el valor, 03 Penalidades.'
          examples: ["01"]
        motivo_o_sustento_de_nota:
          type: string
          description: Solo 07/08. Motivo de la nota (si se omite queda vacío).
        documento_afectado:
          description: Obligatorio en 07/08 (sin este bloque la emisión de la nota falla con 422).
          allOf:
            - $ref: '#/components/schemas/DocumentoAfectado'
    Cliente:
      type: object
      required: [codigo_tipo_documento_identidad, numero_documento]
      properties:
        codigo_tipo_documento_identidad:
          $ref: '#/components/schemas/TipoDocumentoIdentidad'
        numero_documento: { type: string }
        apellidos_y_nombres_o_razon_social:
          type: string
          description: Opcional con RUC (6) o DNI (1), se autocompleta en SUNAT/RENIEC; obligatorio con otros tipos.
        nombre_comercial: { type: string }
        codigo_pais: { type: string, default: PE }
        ubigeo:
          type: string
          pattern: '^\d{6}$'
          description: Ubigeo de 6 dígitos (se valida contra el catálogo cuando el cliente tiene RUC).
        direccion: { type: string }
        correo_electronico: { type: string, format: email }
        telefono: { type: string }
        codigo_tipo_direccion: { type: string }
    Totales:
      type: object
      required: [total_venta]
      description: Importes del comprobante. Si un total viene en 0 o vacío, el sistema lo recalcula desde los ítems.
      properties:
        total_operaciones_gravadas: { type: number }
        total_operaciones_exoneradas: { type: number }
        total_operaciones_inafectas: { type: number }
        total_operaciones_gratuitas: { type: number }
        total_exportacion: { type: number }
        total_igv: { type: number }
        total_igv_operaciones_gratuitas: { type: number }
        total_base_isc: { type: number }
        total_isc: { type: number }
        total_base_otros_impuestos: { type: number }
        total_otros_impuestos: { type: number }
        total_impuestos_bolsa_plastica: { type: number }
        total_impuestos: { type: number }
        total_valor: { type: number }
        total_anticipos: { type: number }
        total_descuentos: { type: number }
        total_cargos: { type: number }
        subtotal_venta: { type: number, description: 'Si no se envía, se usa `total_venta`.' }
        total_venta: { type: number, description: 'Importe total con impuestos.' }
        total_pendiente_pago: { type: number }
    ItemComprobante:
      type: object
      required: [descripcion, unidad_de_medida, cantidad]
      properties:
        codigo_interno:
          type: string
          description: Código/SKU de tu sistema. Se registra en el catálogo del RUC y se reusa. Sin él, todas las ventas usan un producto genérico compartido.
        descripcion: { type: string, description: 'Descripción que se imprime en el PDF/XML.' }
        nombre: { type: string }
        nombre_secundario: { type: string }
        codigo_tipo_item: { type: string, default: "01" }
        codigo_producto_sunat: { type: string }
        unidad_de_medida: { type: string, description: 'Catálogo 03 (NIU bienes, ZZ servicios, KGM...).' }
        cantidad: { type: number }
        valor_unitario: { type: number, description: 'Precio unitario sin IGV.' }
        codigo_tipo_precio: { type: string, description: '01 precio unitario, 02 valor referencial (gratuitas).' }
        precio_unitario: { type: number, description: 'Precio unitario con IGV.' }
        codigo_tipo_afectacion_igv:
          $ref: '#/components/schemas/AfectacionIgv'
        total_base_igv: { type: number }
        porcentaje_igv: { type: number }
        total_igv: { type: number }
        codigo_tipo_sistema_isc: { type: string }
        total_base_isc: { type: number }
        porcentaje_isc: { type: number }
        total_isc: { type: number }
        total_base_otros_impuestos: { type: number }
        porcentaje_otros_impuestos: { type: number }
        total_otros_impuestos: { type: number }
        total_impuestos_bolsa_plastica: { type: number }
        total_impuestos: { type: number }
        total_valor_item: { type: number, description: 'Valor de venta del ítem sin impuestos.' }
        total_cargos: { type: number }
        total_descuentos: { type: number }
        total_item: { type: number, description: 'Total del ítem con impuestos.' }
        informacion_adicional: { type: string }
        actualizar_descripcion:
          type: boolean
          default: true
          description: Si el `codigo_interno` ya existe, actualiza la descripción del producto en el catálogo.
        nombre_producto_pdf: { type: string, description: 'Texto alternativo para el PDF (por defecto, `descripcion`).' }
        nombre_producto_xml: { type: string, description: 'Texto alternativo para el XML (por defecto, `descripcion`).' }
        datos_adicionales:
          type: array
          items:
            type: object
            required: [codigo, descripcion]
            properties:
              codigo: { type: string }
              descripcion: { type: string }
              valor: { type: string }
              fecha_inicio: { type: string, format: date }
              fecha_fin: { type: string, format: date }
              duracion: { type: string }
        descuentos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
        cargos:
          type: array
          items:
            $ref: '#/components/schemas/CargoDescuento'
    Detraccion:
      type: object
      required: [codigo_tipo_detraccion, porcentaje, monto, codigo_metodo_pago, cuenta_bancaria]
      description: Datos de detracción. La leyenda 2006 se agrega automáticamente.
      properties:
        codigo_tipo_detraccion: { type: string, description: 'Código de bien/servicio (catálogo 54), ej. `022`.' }
        porcentaje: { type: number }
        monto: { type: number, description: 'Porcentaje aplicado sobre el total con IGV, a 2 decimales.' }
        codigo_metodo_pago: { type: string, description: 'Catálogo 59, ej. `001` depósito en cuenta.' }
        cuenta_bancaria: { type: string, description: 'Cuenta de detracciones del Banco de la Nación.' }
        ubigeo_origen: { type: string, pattern: '^\d{6}$', description: 'Obligatorio con operación 1004.' }
        ubigeo_destino: { type: string, pattern: '^\d{6}$', description: 'Obligatorio con operación 1004.' }
        direccion_origen: { type: string }
        direccion_destino: { type: string }
        detalle_viaje: { type: string }
        valor_referencial_carga_util: { type: number }
        valor_referencial_servicio_transporte: { type: number }
        valor_referencia_carga_efectiva: { type: number }
    ImpuestoAdicional:
      type: object
      description: Percepción o retención.
      required: [codigo, porcentaje, monto, base]
      properties:
        codigo: { type: string }
        porcentaje: { type: number }
        monto: { type: number }
        base: { type: number }
    CargoDescuento:
      type: object
      required: [codigo, descripcion, factor, monto, base]
      properties:
        codigo: { type: string, description: 'Catálogo 53 SUNAT.' }
        descripcion: { type: string }
        factor: { type: number }
        monto: { type: number }
        base: { type: number }
    Anticipo:
      type: object
      required: [numero, codigo_tipo_documento, monto, total]
      properties:
        numero: { type: string }
        codigo_tipo_documento: { type: string }
        monto: { type: number }
        total: { type: number }
    DocumentoReferencia:
      type: object
      required: [numero, codigo_tipo_documento]
      properties:
        numero: { type: string }
        codigo_tipo_documento: { type: string }
    Leyenda:
      type: object
      required: [codigo, valor]
      properties:
        codigo: { type: string, description: 'Catálogo 52 SUNAT.' }
        valor: { type: string }
    Acciones:
      type: object
      properties:
        enviar_email: { type: boolean, description: 'Enviar el comprobante por correo al cliente.' }
        enviar_xml_firmado: { type: boolean }
        formato_pdf: { type: string, description: 'Formato del PDF (ej. a4, ticket).' }
    Cuota:
      type: object
      required: [fecha, codigo_tipo_moneda, monto]
      properties:
        fecha: { type: string, format: date, description: 'Fecha de vencimiento de la cuota.' }
        codigo_tipo_moneda:
          $ref: '#/components/schemas/Moneda'
        monto: { type: number }
        codigo_metodo_de_pago: { type: string }
    Pago:
      type: object
      required: [codigo_metodo_pago]
      properties:
        codigo_metodo_pago: { type: string, description: 'Código de método de pago del RUC.' }
        codigo_destino_pago: { type: string }
        referencia: { type: string }
        monto: { type: number, default: 0 }
        pago_recibido: { type: number }
    DocumentoAfectado:
      type: object
      description: |
        Comprobante que corrige la nota. Con `external_id` se enlaza al comprobante emitido en FactuSmart
        (si no existe → `422`). Sin `external_id`, se usan `serie_documento` + `numero_documento` +
        `codigo_tipo_documento` como referencia.
      properties:
        external_id: { type: string, format: uuid }
        serie_documento: { type: string }
        numero_documento: { type: string }
        codigo_tipo_documento: { type: string, enum: ["01", "03"] }

    EmitDocumentResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id, creditos_restantes]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            serie_numero: { type: string, examples: [FA01-1234] }
            external_id: { type: string, format: uuid }
            sunat:
              description: |
                `{codigo, descripcion}` si hay respuesta SUNAT guardada; si no, la respuesta cruda del
                envío (`code`, `description`, `notes`...) o `[]` si no se envió.
              type: [object, array]
            creditos_restantes: { type: integer }
        - $ref: '#/components/schemas/SunatFeedback'

    DocumentListItem:
      allOf:
        - type: object
          properties:
            external_id: { type: string, format: uuid }
            serie_numero: { type: string }
            codigo_tipo_documento:
              $ref: '#/components/schemas/TipoDocumentoComprobante'
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            fecha_emision: { type: [string, "null"], format: date }
            total: { type: number }
        - $ref: '#/components/schemas/SunatFeedback'
    DocumentListResponse:
      type: object
      required: [success, comprobantes, siguiente_cursor]
      properties:
        success: { type: boolean, const: true }
        comprobantes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentListItem'
        siguiente_cursor:
          type: [integer, "null"]
          description: Pásalo como `antes_de` para la siguiente página. `null` = no hay más.
    DocumentDetailResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id, links]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            estado_descripcion: { type: [string, "null"] }
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
            fecha_emision: { type: [string, "null"], format: date }
            total: { type: number }
            links:
              type: object
              description: URLs absolutas de descarga (incluyen `?ruc=` si lo enviaste).
              properties:
                pdf: { type: string, format: uri }
                xml: { type: string, format: uri }
                cdr: { type: string, format: uri }
        - $ref: '#/components/schemas/SunatFeedback'
    ResendResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id]
          properties:
            success: { type: boolean, description: 'Si el reintento se ejecutó sin error de sistema (no implica aceptación).' }
            mensaje: { type: [string, "null"] }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
        - $ref: '#/components/schemas/SunatFeedback'
    QuerySunatResponse:
      allOf:
        - type: object
          required: [success, estado, serie_numero, external_id]
          properties:
            success: { type: boolean, const: true }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            serie_numero: { type: string }
            external_id: { type: string, format: uuid }
            consulta:
              type: [object, "null"]
              description: Respuesta cruda de la consulta de CDR a SUNAT.
        - $ref: '#/components/schemas/SunatFeedback'
    HistoryResponse:
      allOf:
        - type: object
          required: [success, external_id, serie_numero, estado, historial]
          properties:
            success: { type: boolean, const: true }
            external_id: { type: string, format: uuid }
            serie_numero: { type: string }
            estado:
              $ref: '#/components/schemas/EstadoCodigo'
            historial:
              type: array
              items:
                type: object
                properties:
                  fecha: { type: [string, "null"], description: 'YYYY-MM-DD HH:MM:SS' }
                  evento:
                    type: string
                    enum: [creado, registrado, enviado, aceptado, observado, rechazado, anulado, por_anular, error, reintento]
                  mensaje: { type: [string, "null"] }
                  codigo_sunat: { type: [string, "null"] }
                  detalle: { type: [object, array, "null"] }
        - $ref: '#/components/schemas/SunatFeedback'
    RucOnlyBody:
      type: object
      properties:
        ruc: { type: string, pattern: '^\d{11}$', description: 'RUC emisor (obligatorio si la cuenta tiene varios).' }

    # ───────────── Anulaciones ─────────────
    VoidRequest:
      type: object
      required: [fecha_de_emision_de_documentos, documentos]
      properties:
        ruc: { type: string, pattern: '^\d{11}$' }
        fecha_de_emision_de_documentos:
          type: string
          pattern: '^\d{2}-\d{2}-\d{4}$'
          description: Fecha de emisión de los comprobantes a anular, formato DD-MM-AAAA. Debe coincidir con la de cada uno.
        documentos:
          type: array
          minItems: 1
          items:
            type: object
            required: [external_id, motivo_anulacion]
            properties:
              external_id: { type: string, format: uuid }
              motivo_anulacion: { type: string }
    VoidResponse:
      type: object
      required: [success, message, ticket, external_id, creditos_restantes]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        ticket: { type: [string, "null"], description: 'Ticket de SUNAT para `GET /anulaciones/{ticket}/status`.' }
        external_id: { type: string, description: 'Identificador de la comunicación de baja.' }
        creditos_restantes: { type: integer }
    VoidStatusResponse:
      type: object
      required: [success, ticket, estado, external_id]
      properties:
        success: { type: boolean, const: true }
        ticket: { type: string }
        estado:
          $ref: '#/components/schemas/EstadoCodigo'
        external_id: { type: string }
        sunat:
          type: [object, "null"]
          description: Respuesta cruda de SUNAT a la consulta del ticket.

    # ───────────── Guías ─────────────
    DispatchGuideRequest:
      type: object
      required:
        - serie_documento
        - fecha_de_emision
        - hora_de_emision
        - codigo_tipo_documento
        - datos_del_emisor
        - items
      additionalProperties: true
      properties:
        ruc: { type: string, pattern: '^\d{11}$' }
        serie_documento: { type: string, description: 'Serie de guía (ej. TA01 remitente, VA01 transportista).' }
        numero_documento: { type: string, default: "#" }
        fecha_de_emision: { type: string, format: date }
        hora_de_emision: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        codigo_tipo_documento:
          type: string
          enum: ["09", "31"]
          description: 09 guía del remitente, 31 guía del transportista.
        datos_del_emisor:
          type: object
          required: [codigo_del_domicilio_fiscal]
          properties:
            codigo_del_domicilio_fiscal: { type: string, description: 'Código del establecimiento emisor (`0000` el principal).' }
        datos_del_cliente_o_receptor:
          $ref: '#/components/schemas/Cliente'
        observaciones: { type: string }
        codigo_modo_transporte: { type: string, enum: ["01", "02"], description: '01 público (transportista), 02 privado.' }
        codigo_motivo_traslado: { type: string, description: 'Catálogo 20 (01 venta, 02 compra, 04 traslado entre establecimientos...).' }
        descripcion_motivo_traslado: { type: string }
        fecha_de_traslado: { type: string, format: date }
        indicador_de_transbordo: { type: boolean, default: false }
        codigo_de_puerto: { type: string }
        unidad_peso_total: { type: string, examples: [KGM] }
        peso_total: { type: number }
        numero_de_bultos: { type: integer }
        numero_de_contenedor: { type: string }
        es_traslado_m1l: { type: boolean, default: false, description: 'Vehículo M1 o L (sin conductor ni vehículo).' }
        numero_de_placa_m1l: { type: string }
        direccion_partida:
          $ref: '#/components/schemas/DireccionGuia'
        direccion_llegada:
          $ref: '#/components/schemas/DireccionGuia'
        transportista:
          type: object
          description: Transporte público (modo 01).
          required: [codigo_tipo_documento_identidad, numero_documento, apellidos_y_nombres_o_razon_social, numero_mtc]
          properties:
            codigo_tipo_documento_identidad: { type: string }
            numero_documento: { type: string }
            apellidos_y_nombres_o_razon_social: { type: string }
            numero_mtc: { type: string }
        chofer:
          $ref: '#/components/schemas/Chofer'
        chofer_secundario:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Chofer'
        vehiculo:
          $ref: '#/components/schemas/Vehiculo'
        vehiculo_secundario:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Vehiculo'
        documento_afectado:
          $ref: '#/components/schemas/DocumentoAfectado'
        documento_relacionado:
          type: array
          items:
            type: object
            properties:
              numero: { type: string }
              empresa: { type: string }
              ruc: { type: string }
              documento:
                type: object
                properties:
                  id: { type: string }
                  descripcion: { type: string }
        datos_remitente:
          $ref: '#/components/schemas/ParteGuia'
        datos_destinatario:
          $ref: '#/components/schemas/ParteGuia'
        pagador_flete:
          type: object
          properties:
            indicador_pagador_flete: { type: string }
            codigo_tipo_documento_identidad: { type: string }
            descripcion_tipo_documento_identidad: { type: string }
            numero: { type: string }
            nombres: { type: string }
        leyendas:
          type: array
          items:
            $ref: '#/components/schemas/Leyenda'
        acciones:
          $ref: '#/components/schemas/Acciones'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemGuia'
    DireccionGuia:
      type: object
      required: [ubigeo, direccion, codigo_del_domicilio_fiscal]
      properties:
        ubigeo: { type: string, pattern: '^\d{6}$' }
        direccion: { type: string }
        codigo_del_domicilio_fiscal: { type: string, description: 'Código de establecimiento SUNAT del punto (`-` si no aplica).' }
    Chofer:
      type: object
      required: [codigo_tipo_documento_identidad, numero_documento]
      properties:
        codigo_tipo_documento_identidad: { type: string }
        numero_documento: { type: string }
        nombres: { type: string }
        numero_licencia: { type: string }
        telefono: { type: string }
    Vehiculo:
      type: object
      properties:
        numero_de_placa: { type: string }
        modelo: { type: string }
        marca: { type: string }
        certificado_habilitacion_vehicular: { type: string }
    ParteGuia:
      type: object
      required: [codigo_tipo_documento_identidad, descripcion_tipo_documento_identidad, numero_documento, apellidos_y_nombres_o_razon_social]
      properties:
        codigo_tipo_documento_identidad: { type: string }
        descripcion_tipo_documento_identidad: { type: string }
        numero_documento: { type: string }
        apellidos_y_nombres_o_razon_social: { type: string }
    ItemGuia:
      type: object
      required: [descripcion, unidad_de_medida, cantidad]
      description: Ítem trasladado. No lleva precio.
      properties:
        codigo_interno: { type: string, description: 'Código del producto; se crea en el catálogo si no existe.' }
        descripcion: { type: string }
        nombre: { type: string }
        codigo_tipo_item: { type: string, default: "01" }
        codigo_producto_sunat: { type: string }
        unidad_de_medida: { type: string }
        cantidad: { type: number }
        informacion_adicional: { type: string }
        dato_adicional: { type: string }
    DispatchResponse:
      type: object
      required: [success, serie_numero, external_id, enviado, mensaje, creditos_restantes]
      properties:
        success: { type: boolean, const: true }
        serie_numero: { type: string, examples: [TA01-15] }
        external_id: { type: string, format: uuid }
        enviado: { type: boolean, description: 'true si SUNAT aceptó el envío (solo entonces se cobra el crédito).' }
        mensaje: { type: string }
        envio:
          type: [object, "null"]
          description: Respuesta cruda del envío a SUNAT (`success`, `message`, ticket...).
        creditos_restantes: { type: integer }
    DispatchStatusResponse:
      type: object
      required: [success, external_id, estado]
      properties:
        success: { type: boolean, const: true }
        external_id: { type: string, format: uuid }
        estado:
          $ref: '#/components/schemas/EstadoCodigo'
        sunat:
          type: [object, "null"]
          description: Respuesta cruda de la consulta del ticket GRE a SUNAT.

    # ───────────── RUCs ─────────────
    RucListResponse:
      type: object
      required: [success, rucs]
      properties:
        success: { type: boolean, const: true }
        rucs:
          type: array
          items:
            type: object
            properties:
              ruc: { type: string }
              nombre: { type: string }
              correo: { type: [string, "null"] }
              entorno:
                type: [string, "null"]
                enum: [demo, produccion, null]
                description: '`demo` = modo prueba (equivale a `entorno: prueba` en los comprobantes). null si el RUC no tiene tenant.'
              activo: { type: boolean }
              creado: { type: [string, "null"], description: 'YYYY-MM-DD HH:MM' }
      example:
        success: true
        rucs:
          - { ruc: "20609999991", nombre: Mi Cliente SAC, correo: contacto@micliente.pe, entorno: demo, activo: true, creado: "2026-07-08 10:30" }
    CreateRucRequest:
      type: object
      required: [ruc, empresa, correo, clave]
      properties:
        ruc: { type: string, pattern: '^\d{11}$', description: 'RUC nuevo (11 dígitos).' }
        empresa: { type: string, maxLength: 255, description: 'Razón social.' }
        correo: { type: string, format: email, description: 'Correo del usuario administrador del panel del RUC.' }
        clave: { type: string, minLength: 6, description: 'Contraseña de acceso al panel del RUC.' }
    CreateRucResponse:
      type: object
      required: [success, ya_existia, ruc, nombre, activo, tenant_url]
      properties:
        success: { type: boolean, const: true }
        ya_existia: { type: boolean }
        ruc: { type: string }
        nombre: { type: string }
        activo: { type: boolean }
        tenant_url: { type: [string, "null"], format: uri, description: 'URL del panel del RUC.' }
        mensaje: { type: string, description: 'Solo cuando se crea (201).' }
      example:
        success: true
        ya_existia: false
        ruc: "20609999991"
        nombre: Mi Cliente SAC
        activo: true
        tenant_url: https://20609999991.s2.factusmart.pe
        mensaje: RUC creado en modo DEMO. Sigue la guía "Pasar a producción" para emitir documentos reales ante SUNAT.
    RucActivationRequest:
      type: object
      required: [activo]
      properties:
        activo: { type: boolean, description: 'false desactiva, true reactiva.' }
    RucActivationResponse:
      type: object
      required: [success, ruc, activo, mensaje]
      properties:
        success: { type: boolean, const: true }
        ruc: { type: string }
        activo: { type: boolean }
        mensaje: { type: string }
