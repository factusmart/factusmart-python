                    reintentable: false
                rucRequerido:
                  value:
                    success: false
                    message: Indica el RUC emisor en el campo "ruc" (tu cuenta tiene varios RUCs enlazados).
                    codigo: RUC_REQUERIDO
                    reintentable: false
        '429':
