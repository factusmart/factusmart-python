[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factusmart"
dynamic = ["version"]
description = "SDK oficial de Python del API de facturación electrónica de FactuSmart (SUNAT, Perú)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "FactuSmart" }]
keywords = ["factusmart", "sunat", "facturacion electronica", "peru", "cpe", "boleta", "factura"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.urls]
Documentacion = "https://factusmart.pe/api-facturacion-electronica/docs/sdks"
Repositorio = "https://github.com/factusmart/factusmart-python"

[tool.setuptools.dynamic]
version = { attr = "factusmart._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factusmart = ["py.typed"]
